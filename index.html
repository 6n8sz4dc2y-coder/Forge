ius:12px;padding:9px 12px;font-size:13px;margin:0}.tag{display:inline-flex;align-items:center;gap:6px;background:#0c1015;border:1px solid #293341;border-radius:999px;padding:7px 10px;color:#cfd6df;font-size:12px;font-weight:800}.progressbar{height:10px;background:#242b35;border-radius:999px;overflow:hidden}.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8e5a);width:0}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,16,.92);backdrop-filter:blur(18px);border-top:1px solid #222b36;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}.nav-inner{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{background:transparent;border:0;color:var(--muted);padding:9px 3px;border-radius:12px;font-size:11px;font-weight:800}.nav button.active{background:#1a2029;color:#fff}.set{display:grid;grid-template-columns:46px 1fr 70px;align-items:center;gap:10px;background:#0b0f14;border:1px solid #202833;border-radius:14px;padding:10px;margin:8px 0}.set.done{border-color:rgba(53,208,127,.7);background:rgba(53,208,127,.08)}.check{width:34px;height:34px;border-radius:50%;border:1px solid #3b4654;background:#11151b;color:#fff;font-weight:900}.set.done .check{background:var(--green);color:#06120b}.listitem{background:#0b0f14;border:1px solid #202833;border-radius:14px;padding:12px;margin:8px 0}.small{font-size:12px}.input{width:100%;background:#0b0f14;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:12px;margin:6px 0}.accessory{border-left:3px solid #334052}.accessory.amrap{border-left-color:var(--yellow)}.accessory.variation{border-left-color:var(--red)}.section-title{margin:18px 0 6px;color:#d8dee8;font-weight:900}.warn{background:#211a0c;border:1px solid #4a3711;color:#ffd98a;border-radius:14px;padding:12px;margin:10px 0}.ok{background:#0d2116;border:1px solid #1b5a38;color:#98f3bf;border-radius:14px;padding:12px;margin:10px 0}.hid .timer{position:fixed;left:16px;right:16px;bottom:92px;max-width:488px;margin:0 auto;background:#111822;border:1px solid #334052;border-radius:18px;padding:12px;z-index:30;display:none;box-shadow:var(--shadow)}
.timer.show{display:block}.timer-time{font-size:28px;font-weight:900}.timer .row{gap:8px}.repbox{display:flex;align-items:center;gap:8px}.rep-input{width:76px;background:#090d12;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:9px;text-align:center;font-weight:800}.kg-input{width:90px;background:#090d12;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:9px;text-align:center;font-weight:800}.set-grid{display:grid;grid-template-columns:44px 1fr 92px 44px;align-items:center;gap:8px}.assist-grid{display:grid;grid-template-columns:1fr 84px 76px 44px;align-items:center;gap:8px}.assist-input{width:100%;background:#090d12;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:9px;text-align:center;font-weight:800}.graph{width:100%;height:150px;background:#0b0f14;border:1px solid #202833;border-radius:14px;margin-top:10px}.graph-label{font-size:11px;fill:#9aa4b2}.graph-line{fill:none;stroke:#f04444;stroke-width:3}.graph-dot{fill:#f04444}.bar{fill:#5aa6ff;opacity:.85}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.legend span{font-size:11px;color:#9aa4b2}.prline{margin-top:8px;font-size:12px;color:#ffd98a}.badge-pr{display:inline-flex;background:#3a1b10;border:1px solid #ff8e5a;color:#ffd5b6;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin-top:6px}.set.done input{opacity:.8}.complete-big{font-size:20px}.timer-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.timer-buttons button{margin:0}


.club-card .club-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.club-ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;flex:0 0 104px;background:conic-gradient(var(--red) calc(var(--pct)*1%), #26303c 0);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset}
.club-ring::before{content:"";position:absolute;width:74px;height:74px;border-radius:50%;background:#0c1015;border:1px solid #222b36}
.club-ring b{position:relative;font-size:22px;z-index:1}
.club-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(max-width:420px){.club-ring{width:86px;height:86px;flex-basis:86px}.club-ring::before{width:62px;height:62px}.club-ring b{font-size:17px}.club-metrics{grid-template-columns:1fr 1fr}.club-metrics .metric:last-child{grid-column:1 / -1}}

.mission{background:linear-gradient(180deg,#161d26,#10151c);border:1px solid #2d3948;border-radius:16px;padding:13px;margin:12px 0}
.mission b{display:block;font-size:16px;margin-bottom:4px}.mission .accent{color:#ff8a8a;font-weight:900}
.plate-line{margin-top:5px;color:#9aa4b2;font-size:11px}.plate-line b{color:#d9e0ea;font-size:11px;display:inline}
.wake{display:inline-flex;align-items:center;gap:6px;background:#0e1712;border:1px solid rgba(53,208,127,.45);color:#98f3bf;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b0f14;border:1px solid #202833;border-radius:14px;padding:12px;margin:8px 0}.toggle{width:auto;margin:0;padding:8px 12px;border-radius:999px}

.quick-notes{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.quick-note{width:auto;margin:0;padding:8px 10px;border-radius:999px;background:#151c25;border:1px solid #303c4b;color:#dce3ec;font-size:12px;font-weight:800}.quick-note.active{background:#3a171b;border-color:var(--red);color:#ffb2b2}.timeline{position:relative;margin-top:10px}.timeline::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:#2b3542}.timeline-item{position:relative;padding:0 0 16px 34px}.timeline-item:last-child{padding-bottom:0}.timeline-dot{position:absolute;left:5px;top:3px;width:16px;height:16px;border-radius:50%;background:#161d26;border:3px solid var(--red);z-index:1}.timeline-item.pr .timeline-dot{border-color:var(--yellow)}.timeline-item.milestone .timeline-dot{border-color:var(--green)}.timeline-date{font-size:11px;color:var(--muted);margin-bottom:3px}.timeline-title{font-weight:900}.mission-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mission-stat{background:#0b0f14;border:1px solid #27313e;border-radius:12px;padding:9px}.mission-stat b{font-size:14px;margin:0}.mission-stat span{font-size:11px;color:var(--muted)}

.backup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:flex;align-items:flex-end;padding:14px}.backup-panel{width:100%;max-width:680px;margin:0 auto;background:#11151b;border:1px solid #343b46;border-radius:18px;padding:16px;box-shadow:0 -12px 40px rgba(0,0,0,.45)}.backup-text{width:100%;height:220px;margin:14px 0;padding:12px;background:#080a0d;color:#e8edf3;border:1px solid #343b46;border-radius:12px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.import-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.import-summary .metric b{font-size:18px}.primary-cta{padding:17px 16px;font-size:16px;box-shadow:0 10px 28px rgba(240,68,68,.18)}

.extra-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.extra-exercise{border-left:3px solid var(--blue)}.extra-set{display:grid;grid-template-columns:1fr 82px 72px 44px;align-items:center;gap:8px}.extra-controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.extra-controls .btn{margin:0}.bodyweight-row{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:12px}.bodyweight-row input{width:18px;height:18px}.remove-link{color:#ff9b9b;background:none;border:0;font-size:12px;text-decoration:underline;padding:4px}.empty-extra{padding:14px;border:1px dashed #334052;border-radius:14px;color:var(--muted);text-align:center}.exercise-picker{margin-top:10px}.exercise-picker .input{margin-bottom:8px}.autosave-status{font-size:11px;color:#98f3bf;margin-top:6px}.resume-banner{background:#0d2116;border:1px solid #1b5a38;color:#98f3bf;border-radius:14px;padding:10px;margin-top:10px}
.favorite-chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}.favorite-chip{width:auto;margin:0;padding:8px 10px;border-radius:999px;background:#1b1620;border:1px solid #49334f;color:#f2d7ff;font-size:12px;font-weight:800}.star-btn{width:auto;background:transparent;border:0;color:#f0c243;font-size:21px;padding:2px 6px}.record-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.record-value{text-align:right;font-weight:900}.record-value span{display:block;font-size:11px;color:var(--muted);font-weight:500}.summary-overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:9998;display:flex;align-items:flex-end;padding:14px}.summary-panel{width:100%;max-width:680px;margin:0 auto;background:linear-gradient(180deg,#171d25,#10141a);border:1px solid #343f4d;border-radius:20px;padding:18px;box-shadow:0 -12px 40px rgba(0,0,0,.5)}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.summary-grid .metric b{font-size:21px}.summary-pr{background:#211a0c;border:1px solid #4a3711;color:#ffd98a;border-radius:14px;padding:12px;margin:10px 0}

.coach-card{border-color:#3b4b61;background:radial-gradient(circle at 95% 0,rgba(90,166,255,.16),transparent 34%),linear-gradient(180deg,#18212c,#10151c)}
.coach-kicker{font-size:11px;letter-spacing:.12em;color:#8fc0ff;font-weight:900;margin-bottom:5px}.coach-focus{font-size:18px;font-weight:900;line-height:1.25}.coach-detail{margin-top:7px;color:#c9d4e2;font-size:13px;line-height:1.45}.coach-targets{display:grid;gap:8px;margin-top:12px}.coach-target{background:#0b1118;border:1px solid #29394a;border-radius:12px;padding:10px}.coach-target b{display:block;font-size:13px}.coach-target span{color:var(--muted);font-size:11px}.coach-action{display:flex;gap:8px;align-items:center;margin-top:8px}.coach-badge{display:inline-flex;background:#10263b;border:1px solid #2c6393;color:#9ed0ff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.load-last{width:auto;margin:8px 0 0;padding:7px 9px;border-radius:10px;font-size:11px}.pb-opportunity{color:#ffd98a;font-weight:900}.coach-off{opacity:.72}.readiness{display:flex;align-items:center;gap:12px}.readiness-dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#16212b;border:1px solid #34485c}.insight{border-left:3px solid #5aa6ff}.goal-row{margin:12px 0}.goal-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:13px}.trend-up{color:#98f3bf}.trend-flat{color:#ffd98a}.trend-down{color:#ff9b9b}.coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.coach-stat{background:#0b1118;border:1px solid #29394a;border-radius:14px;padding:12px}.coach-stat b{display:block;font-size:20px}.journal-entry{border-left:3px solid #7d68ff}.coach-snapshot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid #2f4052;background:#101820;border-radius:16px;margin:12px 0}.coach-snapshot-main{min-width:0}.coach-snapshot-kicker{font-size:10px;letter-spacing:.12em;color:#8fc0ff;font-weight:900;margin-bottom:4px}.coach-snapshot-text{font-size:14px;font-weight:800;line-height:1.35}.coach-snapshot-arrow{font-size:20px;color:#8fc0ff;flex:0 0 auto}.coach-snapshot:active{transform:scale(.99)}


/* v2.2 Gym Experience polish */
@property --pct{syntax:'<number>';inherits:false;initial-value:0}
.card{box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .18s ease,border-color .18s ease}
.btn{min-height:50px;transition:transform .12s ease,filter .12s ease}.btn:active{transform:scale(.985);filter:brightness(.94)}
.input,.assist-input,.rep-input,.kg-input{font-size:16px}
.club-ring{position:relative;--pct:0;transition:--pct 1.1s cubic-bezier(.2,.8,.2,1);background:conic-gradient(var(--red) calc(var(--pct)*1%),#26303c 0)}
.coach-snapshot{transition:transform .15s ease,border-color .15s ease}.coach-snapshot:active{transform:scale(.99)}
.set,.extra-set{position:relative;overflow:hidden;touch-action:pan-y;transition:transform .18s ease,background .18s ease,border-color .18s ease}
.set::after,.extra-set::after{content:'SWIPE TO COMPLETE';position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;background:linear-gradient(90deg,transparent,rgba(53,208,127,.25));color:#98f3bf;font-size:10px;font-weight:900;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .15s ease}
.set.swiping::after,.extra-set.swiping::after{opacity:1}.set.swiping,.extra-set.swiping{transform:translateX(-8px)}
.previous-hint{font-size:10px;color:#98f3bf;margin-top:3px;font-weight:800}
.preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:10000;display:flex;align-items:flex-end;padding:14px;backdrop-filter:blur(8px)}
.preview-panel{width:100%;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#18202a,#0e1319);border:1px solid #344152;border-radius:24px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.55);max-height:88vh;overflow:auto}
.preview-list{margin:12px 0}.preview-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #27313e}.preview-item:last-child{border-bottom:0}.preview-icon{width:30px;height:30px;border-radius:10px;background:#222b36;display:grid;place-items:center;flex:0 0 30px}.preview-target{font-weight:900;color:#fff}.preview-meta{font-size:12px;color:var(--muted);margin-top:2px}
.preview-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;position:sticky;bottom:-18px;background:linear-gradient(transparent,#0e1319 25%);padding-top:18px}
.celebration{position:fixed;inset:0;pointer-events:none;z-index:11000;overflow:hidden}.confetti{position:absolute;top:-20px;width:9px;height:16px;border-radius:2px;animation:confettiFall 1.8s ease-in forwards}.celebration-burst{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);background:#111822;border:1px solid #3a4656;border-radius:999px;padding:14px 20px;font-weight:900;box-shadow:var(--shadow);animation:burst .9s ease forwards;z-index:11001;pointer-events:none}
@keyframes confettiFall{to{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:.2}}@keyframes burst{45%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.summary-panel{animation:panelUp .28s ease both}@keyframes panelUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.club-ring,.card,.btn,.set{transition:none!important}.confetti,.celebration-burst,.summary-panel{animation:none!important}}


/* v2.3 Effortless Logging */
.rep-input,.assist-input{touch-action:manipulation}
.rep-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.rep-picker-panel{width:min(520px,100%);background:linear-gradient(180deg,#1b222d,#10141a);border:1px solid #344052;border-radius:24px;padding:16px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.rep-picker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}
.rep-choice{border:1px solid #344052;background:#0b1016;color:#fff;border-radius:14px;padding:13px 4px;font-weight:900;font-size:17px}
.rep-choice.active{background:var(--red);border-color:var(--red)}
.quick-weight{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:5px}
.quick-weight button{border:1px solid #303b49;background:#111720;color:#dce4ee;border-radius:9px;padding:4px 8px;font-weight:900;font-size:12px}
.next-focus{animation:nextPulse .75s ease}
@keyframes nextPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 3px rgba(90,166,255,.45)}}
.timer-hint{font-size:11px;color:#93a0b0;margin-top:6px}


/* v2.4 Coach's Observations */
.observation-feed{display:grid;gap:10px;margin-top:12px}
.observation-card{position:relative;border:1px solid #2c3745;background:linear-gradient(180deg,#121923,#0c1117);border-radius:16px;padding:14px 44px 14px 14px}
.observation-card.positive{border-left:4px solid #35d07f}.observation-card.watch{border-left:4px solid #f0c243}.observation-card.info{border-left:4px solid #5aa6ff}.observation-card.alert{border-left:4px solid #f06464}.observation-card.goal{border-left:4px solid #a88cff}
.observation-title{font-weight:900;font-size:15px;line-height:1.25}.observation-text{font-size:12px;color:#b6c1ce;line-height:1.45;margin-top:5px}
.observation-meta{display:flex;align-items:center;gap:7px;margin-top:9px}.confidence{font-size:10px;font-weight:900;letter-spacing:.06em;border-radius:999px;padding:4px 7px;background:#17212c;color:#a8b7c8;border:1px solid #2b3a4a}
.why-btn{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:1px solid #354456;background:#111923;color:#a9cfff;font-weight:900;padding:0}
.weekly-review{background:radial-gradient(circle at 100% 0,rgba(53,208,127,.13),transparent 38%),linear-gradient(180deg,#151d25,#0d1218)}

function main(lift,type,pct,reps,total,label){return {kind:'main',lift,type,label:label||`${LIFTS[lift]} ${type}`,pct,reps:String(reps),sets:setsFrom(total,reps),totalReps:total}}
function acc(name,reps,total,opts={}){return {kind:'accessory',name,reps:String(reps||''),sets:setsFrom(total,parseInt(reps))||opts.sets||3,totalReps:total||'',role:opts.role||'assistance',amrap:!!opts.amrap,note:opts.note||''}}
function benchMirror(type,reps,total){return {kind:'benchMirror',lift:'bench',type,label:`Bench ${type} Day`,reps:String(reps),sets:setsFrom(total,reps),totalReps:total,note:'Second weekly bench: mirror first bench day. Touch-and-go; choose by feel. PR only on corresponding strength days.'}}

function flatten(){const arr=[];PHASES.forEach((p,pi)=>p.blocks.forEach((b,bi)=>b.days.forEach((d,di)=>arr.push({phaseIndex:pi,block:b.block,dayIndex:di,globalIndex:arr.length,phase:p.name,desc:p.desc,title:d.title,items:d.items})))); return arr}

function save(){localStorage.setItem('forgeState',JSON.stringify(state));}
function loadWorkoutDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null')}catch(e){return null}}
function clearWorkoutDraft(){localStorage.removeItem(DRAFT_KEY);workoutDraft=null;restEndAt=0;clearInterval(restInterval);document.getElementById('restTimer')?.classList.remove('show')}
function draftHasProgress(d){return !!(d&&(Object.values(d.fields||{}).some(v=>String(v).trim())||(d.completed||[]).length||(d.extraExercises||[]).length||String(d.note||'').trim()))}
function collectWorkoutDraft(){const workout=document.getElementById('workout');if(!workout||!workout.innerHTML)return null;syncExtraInputs();const fields={};workout.querySelectorAll('input[id^="reps-"],input[id^="accw-"],input[id^="accr-"]').forEach(el=>fields[el.id]=el.value);return {version:2,position:state.position,title:current().title,custom:!!workoutDraft?.custom,quickType:workoutDraft?.quickType||'',startedAt:workoutDraft?.startedAt||new Date().toISOString(),savedAt:new Date().toISOString(),fields,completed:[...workout.querySelectorAll('.set.done')].map(el=>el.id),note:document.getElementById('sessionNote')?.value||'',extraExercises:JSON.parse(JSON.stringify(extraExercises)),restEndAt:restEndAt||0}}
function saveWorkoutDraftNow(){if(draftRestoring)return;const d=collectWorkoutDraft();if(!d)return;workoutDraft=d;localStorage.setItem(DRAFT_KEY,JSON.stringify(d));updateAutosaveStatus()}
function queueWorkoutAutosave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(saveWorkoutDraftNow,250)}
function updateAutosaveStatus(){const el=document.getElementById('autosaveStatus');if(!el)return;const when=workoutDraft?.savedAt?new Date(workoutDraft.savedAt):null;el.textContent=when?'Autosaved '+when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'Autosave ready'}
function restoreDraftToDom(){const d=workoutDraft;if(!d||d.position!==state.position)return;draftRestoring=true;Object.entries(d.fields||{}).forEach(([id,value])=>{const el=document.getElementById(id);if(el)el.value=value});(d.completed||[]).forEach(id=>document.getElementById(id)?.classList.add('done'));const note=document.getElementById('sessionNote');if(note)note.value=d.note||'';draftRestoring=false;updateAutosaveStatus();resumeRestTimer()}
function offerWorkoutResume(){const d=workoutDraft;if(!draftHasProgress(d))return;if(!d.custom&&d.position!==state.position){clearWorkoutDraft();return}const saved=d.savedAt?new Date(d.savedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'earlier';if(confirm(`Resume your unfinished ${d.title||'workout'} saved at ${saved}?`)){extraExercises=JSON.parse(JSON.stringify(d.extraExercises||[]));nav('workout');enableWakeLock()}else if(confirm('Discard the unfinished workout?'))clearWorkoutDraft()}

function current(){if(workoutDraft?.custom)return {title:workoutDraft.title||'Quick Workout',phase:'Additional session',block:'—',items:[]};return PROGRAMME[Math.min(state.position,PROGRAMME.length-1)]}
function activeWorkoutDraft(){return !!(workoutDraft&&workoutDraft.startedAt&&(workoutDraft.custom||workoutDraft.position===state.position))}
function activeWorkoutMinutes(){if(!activeWorkoutDraft())return 0;return Math.max(1,Math.floor((Date.now()-new Date(workoutDraft.startedAt).getTime())/60000))}
function resumeWorkout(){if(!activeWorkoutDraft()){startWorkout();return}extraExercises=JSON.parse(JSON.stringify(workoutDraft.extraExercises||[]));enableWakeLock();nav('workout')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function nav(tab){if(document.getElementById('workout')?.classList.contains('active'))saveWorkoutDraftNow();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(tab).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}

function render(){document.getElementById('modePill').textContent=state.settings.mode||'Strict';renderHome();renderWorkout();renderProgramme();renderProgress();renderCoach();renderSettings();}
function pctComplete(){return Math.round((state.position/PROGRAMME.length)*100)}
function total(){return ['deadlift','squat','bench','ohp'].reduce((a,l)=>a+(state.oneRMs[l]||0),0)}
function powerTotal(){return ['deadlift','squat','bench'].reduce((a,l)=>a+(state.oneRMs[l]||0),0)}
function epley(weight,reps){weight=Number(weight||0);reps=Number(reps||0);if(!weight||!reps)return 0;return Math.round((weight*(1+reps/30))*10)/10}
function repsToBeat(lift,weight){const max=Number(state.oneRMs[lift]||0);weight=Number(weight||0);if(!max||!weight)return null;return Math.max(1, Math.floor(((max/weight)-1)*30)+1)}
function restSecondsFor(type,kind){if(kind==='accessory')return 90;if(type==='Speed')return 60;if(type==='Rep')return 90;if(type==='Strength'||type==='Power')return 180;return 120}

async function releaseWakeLock(){workoutAwake=false;try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

function restCompleteAlert(){try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){} try{const C=window.AudioContext||window.webkitAudioContext;if(C){const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.06;osc.connect(gain);gain.connect(ctx.destination);osc.start();setTimeout(()=>{osc.stop();ctx.close()},180)}}catch(e){}}
function plateCalc(weight){weight=Number(weight||0);const bar=20;let side=(weight-bar)/2;if(side<=0)return 'bar only';const plates=[25,20,15,10,5,2.5,1.25];let used=[];for(const p of plates){while(side>=p-.01){used.push(p);side-=p}}return used.length?used.map(fmt).join(' + ')+' each side':'bar only'}
function plateLine(weight){return `<div class="plate-line">Plate calc: <b>${plateCalc(weight)}</b></div>`}

function firstMainItem(w=current()){return mainLiftItems(w).find(i=>i.kind==='main')}
function lastSameSession(){const title=current().title;return [...(state.history||[])].reverse().find(h=>h.title===title)||null}
function bestMainLog(h,lift){if(!h)return null;const logs=(h.mainLogs||[]).filter(x=>x.lift===lift&&Number(x.weight)>0&&Number(x.reps)>0);if(!logs.length)return null;return logs.sort((a,b)=>(Number(b.weight)-Number(a.weight))||(Number(b.reps)-Number(a.reps)))[0]}
function missionText(){const w=current();const fm=firstMainItem(w);if(!fm)return 'Complete the session and keep the movement quality high.';const topWeight=itemWeight(fm,fm.ramp?fm.ramp.length-1:fm.sets-1);const previous=bestMainLog(lastSameSession(),fm.lift);if(fm.type==='Speed')return `Move every rep fast and identical at ${fmt(topWeight)}kg. Quality beats fatigue today.`;if(previous){if(Number(previous.weight)===Number(topWeight))return `Beat last time: ${fmt(Number(previous.weight))}kg × ${previous.reps}. Target ${Number(previous.reps)+1}+ clean reps.`;return `Last time: ${fmt(Number(previous.weight))}kg × ${previous.reps}. Complete today's ${fmt(topWeight)}kg top work with clean reps.`}const beat=repsToBeat(fm.lift,topWeight);if(beat)return `Establish your benchmark at ${fmt(topWeight)}kg. Target ${beat}+ reps for a new estimated 1RM.`;return `Complete ${mainSummary(fm)} with clean reps.`}
function lastLogsForExercise(name){const key=String(name||'').toLowerCase();for(const h of [...(state.history||[])].reverse()){const logs=[...(h.accLogs||[]),...(h.extraLogs||[])].filter(x=>String(x.name||'').toLowerCase()===key&&Number(x.reps)>0);if(logs.length)return {date:h.date,logs}}return null}
function coachAccessoryTarget(it){const prev=lastLogsForExercise(it.name);const top=topTarget(it.reps);if(!prev)return {headline:'Set a baseline',detail:`Log every set of ${it.name} so Coach Mode can prescribe the next target.`};const reps=prev.logs.map(x=>Number(x.reps||0));const weights=prev.logs.map(x=>Number(x.weight||0)).filter(Boolean);const total=reps.reduce((a,b)=>a+b,0);const maxWeight=weights.length?Math.max(...weights):0;if(it.amrap){const best=Math.max(...reps);return {headline:`Target ${best+1}+ reps`,detail:`Last time: ${best} reps. Beat it with the same clean standard.`}}if(top&&reps.length&&reps.every(r=>r>=top)&&maxWeight){return {headline:`Try ${fmt(r25(maxWeight+(state.settings.roundTo||2.5)))}kg`,detail:`You reached the top of the rep range last time. Take the smallest sensible increase.`}}return {headline:`Beat ${total} total reps`,detail:`Repeat around ${maxWeight?fmt(maxWeight)+'kg':'the same load'} and add at least one clean rep across the sets.`}}
function coachMainTarget(){const fm=firstMainItem();if(!fm)return {headline:'Complete the session',detail:'Keep technique consistent and log the work.'};const topWeight=itemWeight(fm,fm.ramp?fm.ramp.length-1:fm.sets-1);const prev=bestMainLog(lastSameSession(),fm.lift);if(fm.type==='Speed')return {headline:`Own ${fmt(topWeight)}kg`,detail:'Every rep should look the same. Stop chasing fatigue when bar speed drops.'};if(prev&&Number(prev.weight)===Number(topWeight)){return {headline:`Target ${Number(prev.reps)+1}+ reps at ${fmt(topWeight)}kg`,detail:`Last matching session: ${fmt(Number(prev.weight))}kg × ${prev.reps}. One more clean rep is progress.`}}const beat=repsToBeat(fm.lift,topWeight);return {headline:beat?`${beat}+ reps at ${fmt(topWeight)}kg`:`Complete ${mainSummary(fm)}`,detail:beat?'That result would exceed your current estimated 1RM.':'Execute the programmed work without missed reps.'}}
function coachBriefingHtml(compact=false){if(state.settings.coachMode===false)return '';const w=current(),mainTarget=coachMainTarget();const accessories=w.items.filter(x=>x.kind==='accessory').slice(0,compact?2:3);return `<div class="card coach-card"><div class="coach-kicker">COACH MODE</div><div class="coach-focus">${esc(mainTarget.headline)}</div><div class="coach-detail">${esc(mainTarget.detail)}</div>${accessories.length?`<div class="coach-targets">${accessories.map(it=>{const t=coachAccessoryTarget(it);return `<div class="coach-target"><b>${esc(it.name)} — ${esc(t.headline)}</b><span>${esc(t.detail)}</span></div>`}).join('')}</div>`:''}</div>`}
function coachSnapshotHtml(){if(state.settings.coachMode===false)return '';const t=coachMainTarget();return `<button class="coach-snapshot" onclick="showTab('coach')" aria-label="Open Coach tab"><div class="coach-snapshot-main"><div class="coach-snapshot-kicker">COACH SNAPSHOT</div><div class="coach-snapshot-text">${esc(t.headline)} — ${esc(t.detail)}</div></div><div class="coach-snapshot-arrow">›</div></button>`}
function loadPreviousAccessory(idx,name){const prev=lastLogsForExercise(name);if(!prev){toast('No previous performance found');return}prev.logs.forEach((x,i)=>{const w=document.getElementById(`accw-${idx}-${i}`),r=document.getElementById(`accr-${idx}-${i}`);if(w)w.value=x.weight||'';if(r)r.value=x.reps||''});queueWorkoutAutosave();toast('Previous sets loaded')}
function loadPreviousExtra(id,name){const prev=lastLogsForExercise(name);const ex=extraExercises.find(x=>String(x.id)===String(id));if(!prev||!ex){toast('No previous performance found');return}ex.bodyweight=prev.logs.every(x=>x.bodyweight);ex.sets=prev.logs.map(x=>({weight:x.weight||'',reps:x.reps||''}));renderExtraExercises();queueWorkoutAutosave();toast('Previous sets loaded')}

function relativeDaysLabel(date){const days=Math.max(0,Math.floor((Date.now()-new Date(date).getTime())/86400000));return days===0?'Today':days===1?'Yesterday':`${days} days ago`}
function missionMeta(){const prev=lastSameSession();if(!prev)return `<div class="mission-stats"><div class="mission-stat"><b>Set today’s benchmark</b><span>No previous matching session</span></div><div class="mission-stat"><b>${state.position+1}/${PROGRAMME.length}</b><span>Programme position</span></div></div>`;return `<div class="mission-stats"><div class="mission-stat"><b>${relativeDaysLabel(prev.date)}</b><span>Last completed</span></div><div class="mission-stat"><b>${fmt(prev.volume||0)}kg</b><span>Previous volume</span></div></div>`}
function addQuickNote(text,btn){const box=document.getElementById('sessionNote');if(!box)return;const parts=box.value.split(' • ').map(x=>x.trim()).filter(Boolean);const i=parts.indexOf(text);if(i>=0)parts.splice(i,1);else parts.push(text);box.value=parts.join(' • ');btn?.classList.toggle('active',i<0);queueWorkoutAutosave()}
function topTarget(reps){const nums=String(reps||'').match(/\d+/g);return nums?Number(nums[nums.length-1]):null}
function assistanceSuggestion(it){const last=lastAccessoryLog(it.name);const target=topTarget(it.reps);if(!last||!target)return it.amrap?'Beat last AMRAP reps when you can.':'Log weight and reps to build progression.';const reps=last.split('/').map(x=>Number((x.match(/×(\d+)/)||[])[1]||0));const allHit=reps.length && reps.every(r=>r>=target);return allHit?`Progression: you hit the top target last time — try a small weight increase.`:`Progression: beat last total reps before adding weight.`}
let restInterval=null, restLeft=0;
function startRest(seconds){if(!state.settings.autoRest)return;restEndAt=Date.now()+seconds*1000;saveWorkoutDraftNow();resumeRestTimer()}
function updateRestFromClock(){restLeft=Math.max(0,Math.ceil((restEndAt-Date.now())/1000));if(restLeft<=0){clearInterval(restInterval);restEndAt=0;document.getElementById('restTimer')?.classList.remove('show');saveWorkoutDraftNow();restCompleteAlert();toast('Rest complete');return}drawTimer()}
function resumeRestTimer(){if(!restEndAt||restEndAt<=Date.now()){if(restEndAt){restEndAt=0;saveWorkoutDraftNow()}return}document.getElementById('restTimer')?.classList.add('show');clearInterval(restInterval);updateRestFromClock();restInterval=setInterval(updateRestFromClock,1000)}
function drawTimer(){const el=document.getElementById('restTimer');if(!el)return;const m=Math.floor(restLeft/60),sec=String(restLeft%60).padStart(2,'0');el.innerHTML=`<div class="row"><div><div class="muted small">Rest timer</div><div class="timer-time">${m}:${sec}</div><div class="timer-hint">Accurate after switching apps or locking your phone.</div></div><span class="tag">StrengthOS</span></div><div class="timer-buttons"><button class="btn secondary mini" onclick="skipTimer()">Skip</button><button class="btn secondary mini" onclick="addTimer(30)">+30s</button><button class="btn secondary mini" onclick="addTimer(-30)">-30s</button></div>`}
function skipTimer(){clearInterval(restInterval);restEndAt=0;document.getElementById('restTimer')?.classList.remove('show');saveWorkoutDraftNow()}
function addTimer(s){restEndAt=Math.max(Date.now(),restEndAt+s*1000);if(restEndAt<=Date.now())skipTimer();else{saveWorkoutDraftNow();resumeRestTimer()}}
function scrollNext(el){const rows=[...document.querySelectorAll('#workout .set')];const i=rows.indexOf(el);const next=rows.slice(i+1).find(x=>!x.classList.contains('done'));if(next){next.scrollIntoView({behavior:'smooth',block:'center'});next.classList.add('next-focus');setTimeout(()=>next.classList.remove('next-focus'),850)}}
function lastSetTargetText(it,weight){if(!it.lift||!weight)return '';const beat=repsToBeat(it.lift,weight);return beat?`Beat current ${LIFTS[it.lift]} 1RM: ${beat}+ reps at ${fmt(weight)}kg`:''}
function collectPotentialPRs(){let prs=[];document.querySelectorAll('[data-pr-lift]').forEach(el=>{const lift=el.dataset.prLift, weight=Number(el.dataset.prWeight), reps=Number(el.value||0);const est=epley(weight,reps);if(est>(state.oneRMs[lift]||0)) prs.push({lift,weight,reps,est});});return prs}
function handlePRs(prs){if(!prs.length)return [];let accepted=[];prs.forEach(pr=>{const old=state.oneRMs[pr.lift];if(confirm(`New estimated ${LIFTS[pr.lift]} 1RM: ${fmt(pr.est)}kg from ${fmt(pr.weight)}kg × ${pr.reps}. Update your 1RM from ${fmt(old)}kg?`)){state.oneRMs[pr.lift]=Math.max(old,Math.round(pr.est));accepted.push({...pr,old,newMax:state.oneRMs[pr.lift],date:new Date().toISOString()});}});state.prs=[...(state.prs||[]),...accepted];return accepted}

function clubMilestoneText(total,goal){const milestones=[400,425,450,475,500].filter(x=>x<=goal);const next=milestones.find(x=>total<x);if(!next)return `${fmt(goal)}kg Club achieved`;return `${fmt(next-total)}kg until the ${next}kg Club`}
function homeWorkoutPlanHtml(){const items=sessionPreviewItems();return `<div class="home-plan"><div class="row"><div class="section-title" style="margin:0">TODAY'S EXERCISES</div><span class="muted small">≈ ${estimatedSessionMinutes()} min</span></div>${items.map((x,i)=>`<div class="home-plan-item"><span>${i+1}</span><div><b>${esc(x.name)}</b><div class="muted small">${esc(x.target)}${x.meta?' • '+esc(x.meta):''}</div></div></div>`).join('')}</div>`}
function renderHome(){const w=workoutDraft?.custom?PROGRAMME[Math.min(state.position,PROGRAMME.length-1)]:current();const totalKg=powerTotal();const goal=state.settings.goalTotal||500;const pct=Math.min(100,Math.round(totalKg/goal*100));const active=activeWorkoutDraft();const elapsed=activeWorkoutMinutes();document.getElementById('home').innerHTML=`
<div class="card hero"><div class="row"><div><div class="muted small">${active?'WORKOUT IN PROGRESS':'TODAY'}</div><div class="title">${active?esc(workoutDraft.title):w.title}</div><div class="muted">${active&&workoutDraft.custom?'Additional session':`${w.phase} • Block ${w.block} • Workout ${state.position+1} / ${PROGRAMME.length}`}</div></div><span class="tag">${active?elapsed+' min':state.position+1+'/'+PROGRAMME.length}</span></div>${active?`<div class="mission"><b>Session saved</b><span>Started ${new Date(workoutDraft.startedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}. Your completed sets and entries are preserved.</span></div>`:`<div class="mission"><b>Today’s Mission</b><span>${missionText()}</span>${missionMeta()}</div>${homeWorkoutPlanHtml()}`}<button class="btn primary-cta ${active?'green':''}" onclick="${active?'resumeWorkout()':'beginWorkoutDirect()'}">${active?'RESUME WORKOUT':'BEGIN TODAY’S WORKOUT'}</button>${active?'':`<button class="btn secondary quick-workout-btn" onclick="showQuickWorkoutPicker()">+ ADD AN EXTRA WORKOUT</button>`}</div>
${coachSnapshotHtml()}
<div class="card club-card"><div class="club-head"><div><div class="h2">500kg Club</div><div class="muted small">Power total: Deadlift + Squat + Bench only</div></div><div class="club-ring" style="--pct:${pct}"><b>${pct}%</b></div></div><div class="club-metrics"><div class="metric"><b>${fmt(totalKg)}kg</b><span>Power total</span></div><div class="metric"><b>${fmt(goal)}kg</b><span>Target</span></div><div class="metric"><b>${clubMilestoneText(totalKg,goal)}</b><span>Next milestone</span></div></div></div>
<div class="grid">${['deadlift','squat','bench','ohp'].map(l=>`<div class="metric"><b>${fmt(state.oneRMs[l])}</b><span>${LIFTS[l]} 1RM</span><br><span>${l==='ohp'?'Tracked separately • ':''}Campbell Max ${fmt(cm(l))}kg</span></div>`).join('')}</div>
<div class="card"><div class="h2">Next workout</div>${nextSummary()}</div><div class="card"><div class="h2">Last workout</div>${state.history.length?histSummary(state.history[state.history.length-1]):'<div class="muted">No workouts completed yet.</div>'}</div>`}
function beginWorkoutDirect(){if(activeWorkoutDraft()){resumeWorkout();return}beginWorkoutFromPreview()}
function showQuickWorkoutPicker(){document.getElementById('quickWorkoutPicker')?.remove();const modal=document.createElement('div');modal.id='quickWorkoutPicker';modal.className='preview-overlay';modal.innerHTML=`<div class="preview-panel"><div class="muted small">ADDITIONAL SESSION</div><div class="title">What are you doing?</div><div class="muted">This will be saved in your history without advancing the programme.</div><div class="quick-type-grid">${['Mobility & Stretching','Pull-ups & Arms','Conditioning','Technique Work','Recovery Session','Custom Workout'].map(x=>`<button class="quick-type" onclick="beginQuickWorkout('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div><button class="btn secondary" onclick="document.getElementById('quickWorkoutPicker')?.remove()">Cancel</button></div>`;document.body.appendChild(modal)}
function beginQuickWorkout(type){document.getElementById('quickWorkoutPicker')?.remove();let title=type;if(type==='Custom Workout'){const entered=prompt('Name this workout','Extra Workout');if(entered===null)return;title=entered.trim()||'Extra Workout'}workoutDraft={version:2,position:state.position,title,custom:true,quickType:type,startedAt:new Date().toISOString(),savedAt:new Date().toISOString(),fields:{},completed:[],note:'',extraExercises:[],restEndAt:0};localStorage.setItem(DRAFT_KEY,JSON.stringify(workoutDraft));extraExercises=[];enableWakeLock();nav('workout');toast('Add your exercises below')}
function nextSummary(){const n=PROGRAMME[Math.min(state.position+1,PROGRAMME.length-1)];return n?`<b>${n.title}</b><div class="muted small">${n.phase} • Block ${n.block} • Workout ${Math.min(state.position+2,PROGRAMME.length)} / ${PROGRAMME.length}</div>`:'<div class="muted">Cycle complete.</div>'}
function histSummary(h){return `<b>${h.title}</b><div class="muted small">${h.phase} • ${new Date(h.date).toLocaleString()}</div>`}
function itemWeight(it,setIndex=0){if(it.kind==='benchMirror')return null;if(it.kind!=='main')return null;const pct=it.ramp?it.ramp[setIndex]||it.pct:it.pct;return weightFor(it.lift,pct,false)}
function mainSummary(it){if(it.kind==='benchMirror')return `${it.sets} × ${it.reps} • by feel`; if(it.ramp)return it.ramp.map(p=>`${fmt(weightFor(it.lift,p))}×${it.reps}`).join(' / ');return `${it.sets} × ${it.reps} @ ${fmt(weightFor(it.lift,it.pct))}kg (${Math.round(it.pct*1000)/10}%)`}
function warmups(lift,target){let bar=lift==='ohp'?20:20; let arr=[{w:bar,r:5},{w:r25(target*.45),r:5},{w:r25(target*.65),r:3},{w:r25(target*.8),r:1}]; return arr.filter((x,i,a)=>x.w>0 && (i===0||x.w!==a[i-1].w) && x.w<target)}
function renderWorkout(){const w=current();let mainItems=w.items.filter(i=>i.kind==='main'||i.kind==='benchMirror');let accItems=w.items.filter(i=>i.kind==='accessory');let firstMain=mainItems.find(i=>i.kind==='main');let target=firstMain?itemWeight(firstMain, firstMain.ramp?firstMain.ramp.length-1:0):null;document.getElementById('workout').innerHTML=`
<div class="card hero"><div class="row"><div><div class="muted small">${w.phase} • Block ${w.block} • Day ${w.dayIndex+1}</div><div class="title">${w.title}</div><div class="muted">StrengthOS session</div><div class="autosave-status" id="autosaveStatus">Autosave ready</div></div><span class="wake">Awake</span></div><div class="mission"><b>Today’s Mission</b><span>${missionText()}</span>${missionMeta()}</div></div>
${coachBriefingHtml(false)}
${firstMain?`<div class="card"><div class="h2">Warm-up</div>${warmups(firstMain.lift,target).map((s,i)=>setRow(`w${i}`,`${fmt(s.w)}kg × ${s.r}`,false)).join('')}</div>`:''}
<div class="card"><div class="h2">Main Work</div>${mainItems.map((it,idx)=>mainBlock(it,idx)).join('')}</div>
<div class="card"><div class="h2">Accessories</div>${accItems.map((it,idx)=>accessoryBlock(it,idx)).join('')}</div>
<div class="card"><div class="extra-head"><div><div class="h2">Extra Exercises</div><div class="muted small">Add anything you do after the programmed session. These sets are saved in your history and session volume.</div></div><button class="btn secondary mini" onclick="showExercisePicker()">+ Add</button></div><div id="exercisePicker" class="exercise-picker hidden">${favouritePickerHtml()}<input id="exerciseSearch" class="input" list="exerciseOptions" placeholder="Search or type a custom exercise"><datalist id="exerciseOptions">${EXERCISE_LIBRARY.map(x=>`<option value="${x}"></option>`).join('')}</datalist><div class="two-buttons"><button class="btn secondary mini" onclick="hideExercisePicker()">Cancel</button><button class="btn mini" onclick="addExtraExercise()">Add Exercise</button></div></div><div id="extraExercises"><div class="empty-extra">No extra exercises added yet.</div></div></div>
<div class="card"><div class="h2">Coach’s Notebook</div><div class="muted small">One useful line is enough. Tap any quick note, then add detail if needed.</div><div class="quick-notes">${['Felt strong','Moved well','Hard session','Poor sleep','Joint discomfort','Increase next time'].map(x=>`<button class="quick-note" onclick="addQuickNote('${x}',this)">${x}</button>`).join('')}</div><textarea id="sessionNote" class="input note" placeholder="What moved well? Anything to watch next time?"></textarea><button class="btn green" onclick="finishWorkout()">FINISH WORKOUT</button>${workoutDraft?.custom?'':`<button class="btn secondary" onclick="skipForward()">Skip to next workout</button>`}</div>`;if(workoutDraft?.position===state.position&&extraExercises.length===0)extraExercises=JSON.parse(JSON.stringify(workoutDraft.extraExercises||[]));renderExtraExercises();restoreDraftToDom()}
function setRow(id,txt,done=false,opts={}){const reps=opts.reps||'';const wt=opts.weight||'';const prAttrs=opts.pr?`data-pr-lift="${opts.lift}" data-pr-weight="${wt}"`:'';const target=opts.target?`<div class="prline">${opts.target}</div>`:'';const plates=opts.plate?plateLine(wt):'';return `<div class="set ${done?'done':''}" id="set-${id}"><button class="check" onclick="toggleSet('${id}',${opts.rest||120})">✓</button><div><b>${txt}</b>${target}${plates}</div><div class="repbox">${opts.repInput?`<input ${prAttrs} class="rep-input rep-tap" id="reps-${id}" inputmode="none" readonly placeholder="reps" value="${reps}">`:opts.label||'<span class="muted small">set</span>'}</div></div>`}
function mainBlock(it,idx){let html=`<div class="listitem"><div class="row"><div><b>${it.label}</b><div class="muted small">${mainSummary(it)}</div>${it.note?`<div class="warn small">${it.note}</div>`:''}</div><span class="tag">${it.type}</span></div>`; if(it.kind==='benchMirror'){for(let s=0;s<it.sets;s++)html+=setRow(`m${idx}-${s}`,`Set ${s+1}: Bench by feel`,false,{repInput:true,reps:it.reps,rest:restSecondsFor(it.type,'main'),label:'reps'});return html+'</div>'} for(let s=0;s<it.sets;s++){let wt=itemWeight(it,s);let pct=it.ramp?` (${Math.round((it.ramp[s]||it.pct)*1000)/10}%)`:'';let isTop=(s===it.sets-1 && (it.type==='Strength'||it.type==='Power'||it.type==='Rep'));let target=isTop?lastSetTargetText(it,wt):'';html+=setRow(`m${idx}-${s}`,`Set ${s+1}: ${fmt(wt)}kg ×`,false,{repInput:true,reps:it.reps,weight:wt,lift:it.lift,pr:isTop,target,rest:restSecondsFor(it.type,'main'),plate:true})} if(it.type==='Strength'||it.type==='Power')html+=`<div class="warn small">Top set: enter reps. If you beat your estimated 1RM, StrengthOS will offer to update it.</div>`;return html+'</div>'}
function accessoryBlock(it,idx){let last=lastAccessoryLog(it.name);let lastLine=last?`<div class="muted small">Last time: ${last}</div>`:'';const coach=state.settings.coachMode===false?null:coachAccessoryTarget(it);let html=`<div class="listitem accessory ${it.amrap?'amrap':''} ${it.role==='variation'?'variation':''}"><div class="row"><div><b>${it.name}</b><div class="muted small">Target reps: ${it.amrap?'AMRAP':it.reps}${it.totalReps?` • target total ${it.totalReps}`:''}</div>${lastLine}${coach?`<div class="prline"><span class="coach-badge">Coach</span> ${esc(coach.headline)} — ${esc(coach.detail)}</div>`:`<div class="prline">${assistanceSuggestion(it)}</div>`}${it.note?`<div class="muted small">${it.note}</div>`:''}${last?`<button class="btn ghost load-last" onclick="loadPreviousAccessory(${idx},'${esc(it.name).replace(/&#39;/g,"\\'")}')">Use last sets</button>`:''}</div><span class="tag">${it.role}</span></div>`;let sets=it.amrap?1:(it.sets||3);for(let s=0;s<sets;s++){html+=`<div class="set assist-grid" id="set-a${idx}-${s}"><div><b>${it.amrap?'AMRAP':`Set ${s+1}`}</b><div class="muted small">${it.amrap?'Clean reps to failure':`Target (${it.reps})`}</div>${previousWeightFor(it.name,s)?'<div class="previous-hint">Last weight pre-filled</div>':''}</div><div><input class="assist-input" id="accw-${idx}-${s}" inputmode="decimal" placeholder="kg" value="${previousWeightFor(it.name,s)}" data-acc-name="${it.name}" data-acc-set="${s+1}"><div class="quick-weight"><button type="button" onclick="nudgeWeight('accw-${idx}-${s}',-${state.settings.roundTo||2.5})">−</button><button type="button" onclick="copyWeightDown('accw-${idx}-${s}')">↧</button><button type="button" onclick="nudgeWeight('accw-${idx}-${s}',${state.settings.roundTo||2.5})">+</button></div></div><input class="assist-input rep-tap" id="accr-${idx}-${s}" inputmode="none" placeholder="reps" data-acc-name="${it.name}" data-acc-set="${s+1}" readonly><button class="check" onclick="toggleSet('a${idx}-${s}',${restSecondsFor('', 'accessory')})">✓</button></div>`}return html+'</div>'}
function lastAccessoryLog(name){let hist=[...(state.history||[])].reverse();for(const h of hist){let logs=(h.accLogs||[]).filter(x=>x.name===name&&x.weight&&x.reps);if(logs.length)return logs.map(x=>`${fmt(Number(x.weight))}×${x.reps}`).join(' / ')}return ''}
const EXERCISE_LIBRARY=['Pull Ups','Chin Ups','Weighted Pull Ups','Lat Pulldown','Landmine Row','DB Row','Cable Row','Barbell Row','Face Pulls','Band Pull Aparts','DB Bicep Curl','Hammer Curl','EZ Bar Curl','Cable Curl','Preacher Curl','Dips','Tricep Pushdown','DB Tricep Extension','Skull Crusher','Lateral Raise','Rear Delt Fly','DB Shoulder Press','Leg Extension','Leg Curl','Calf Raise','Romanian Deadlift','Back Extension','Ab Wheel','Hanging Leg Raise','Plank','Farmer Carry'];
