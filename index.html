<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Forge PRS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">FORGE PRS</div>
        <h1 id="greeting">Good morning, Gavin</h1>
      </div>
      <button id="resetBtn" class="icon-btn" title="Reset demo data">↻</button>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button data-tab="home" class="tab active">⌂<span>Home</span></button>
      <button data-tab="workout" class="tab">◉<span>Workout</span></button>
      <button data-tab="progress" class="tab">↗<span>Progress</span></button>
      <button data-tab="library" class="tab">▤<span>Library</span></button>
      <button data-tab="settings" class="tab">⚙<span>Settings</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
