.timer.show{display:block}.timer-time{font-size:28px;font-weight:900}.timer .row{gap:8px}.repbox{display:flex;align-items:center;gap:8px}.rep-input{width:76px;background:#090d12;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:9px;text-align:center;font-weight:800}.kg-input{width:90px;background:#090d12;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:9px;text-align:center;font-weight:800}.set-grid{display:grid;grid-template-columns:44px 1fr 92px 44px;align-items:center;gap:8px}.assist-grid{display:grid;grid-template-columns:1fr 84px 76px 44px;align-items:center;gap:8px}.assist-input{width:100%;background:#090d12;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:9px;text-align:center;font-weight:800}.graph{width:100%;height:150px;background:#0b0f14;border:1px solid #202833;border-radius:14px;margin-top:10px}.graph-label{font-size:11px;fill:#9aa4b2}.graph-line{fill:none;stroke:#f04444;stroke-width:3}.graph-dot{fill:#f04444}.bar{fill:#5aa6ff;opacity:.85}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.legend span{font-size:11px;color:#9aa4b2}.prline{margin-top:8px;font-size:12px;color:#ffd98a}.badge-pr{display:inline-flex;background:#3a1b10;border:1px solid #ff8e5a;color:#ffd5b6;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin-top:6px}.set.done input{opacity:.8}.complete-big{font-size:20px}.timer-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.timer-buttons button{margin:0}.home-workout-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.home-workout-controls .btn{margin:0}@media(max-width:380px){.home-workout-controls{grid-template-columns:1fr}}

.mission b{display:block;font-size:16px;margin-bottom:4px}.mission .accent{color:#ff8a8a;font-weight:900}
.plate-line{margin-top:5px;color:#9aa4b2;font-size:11px}.plate-line b{color:#d9e0ea;font-size:11px;display:inline}

.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b0f14;border:1px solid #202833;border-radius:14px;padding:12px;margin:8px 0}.toggle{width:auto;margin:0;padding:8px 12px;border-radius:999px}
.settings-list{padding:4px}.settings-list-row{display:flex;align-items:center;gap:13px;width:100%;background:transparent;border:0;border-bottom:1px solid #1e2733;padding:15px 6px;text-align:left;color:var(--text);cursor:pointer}.settings-list-row:last-child{border-bottom:0}.settings-list-icon{font-size:21px;flex:0 0 auto;width:28px;text-align:center}.settings-list-text{flex:1;min-width:0}.settings-list-text b{display:block;font-size:15px;font-weight:800}.settings-list-text .muted{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settings-list-chevron{font-size:22px;color:#cfd6df;flex:0 0 auto}.settings-list-row.danger .settings-list-text b{color:#ff9b9b}

.backup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:flex;align-items:flex-end;padding:14px}.backup-panel{width:100%;max-width:680px;margin:0 auto;background:#11151b;border:1px solid #343b46;border-radius:18px;padding:16px;box-shadow:0 -12px 40px rgba(0,0,0,.45)}.backup-text{width:100%;height:220px;margin:14px 0;padding:12px;background:#080a0d;color:#e8edf3;border:1px solid #343b46;border-radius:12px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}

.favorite-chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}.favorite-chip{width:auto;margin:0;padding:8px 10px;border-radius:999px;background:#1b1620;border:1px solid #49334f;color:#f2d7ff;font-size:12px;font-weight:800}.star-btn{width:auto;background:transparent;border:0;color:#f0c243;font-size:21px;padding:2px 6px}.record-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.record-value{text-align:right;font-weight:900}.record-value span{display:block;font-size:11px;color:var(--muted);font-weight:500}.summary-overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:9998;display:flex;align-items:flex-end;padding:14px}.summary-panel{width:100%;max-width:680px;margin:0 auto;background:linear-gradient(180deg,#171d25,#10141a);border:1px solid #343f4d;border-radius:20px;padding:18px;box-shadow:0 -12px 40px rgba(0,0,0,.5)}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.summary-grid .metric b{font-size:21px}.summary-pr{background:#211a0c;border:1px solid #4a3711;color:#ffd98a;border-radius:14px;padding:12px;margin:10px 0}

.coach-card{border-color:#3b4b61;background:radial-gradient(circle at 95% 0,rgba(90,166,255,.16),transparent 34%),linear-gradient(180deg,#18212c,#10151c)}
.coach-kicker{font-size:11px;letter-spacing:.12em;color:#8fc0ff;font-weight:900;margin-bottom:5px}.coach-focus{font-size:22px;font-weight:900;line-height:1.25;display:flex;align-items:center;gap:10px}.coach-focus .mission-icon{font-size:26px;line-height:1;flex:0 0 auto}.coach-detail{margin-top:7px;color:#c9d4e2;font-size:13px;line-height:1.45}.coach-targets{display:grid;gap:8px;margin-top:12px}.coach-target{background:#0b1118;border:1px solid #29394a;border-radius:12px;padding:10px}.coach-target b{display:block;font-size:13px}.coach-target span{color:var(--muted);font-size:11px}.coach-action{display:flex;gap:8px;align-items:center;margin-top:8px}.coach-badge{display:inline-flex;background:#10263b;border:1px solid #2c6393;color:#9ed0ff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.load-last{width:auto;margin:8px 0 0;padding:7px 9px;border-radius:10px;font-size:11px}.pb-opportunity{color:#ffd98a;font-weight:900}.coach-off{opacity:.72}.readiness{display:flex;align-items:center;gap:12px}.readiness-dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#16212b;border:1px solid #34485c}.insight{border-left:3px solid #5aa6ff}.goal-row{margin:12px 0}.goal-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:13px}.trend-up{color:#98f3bf}.trend-flat{color:#ffd98a}.trend-down{color:#ff9b9b}.coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.coach-stat{background:#0b1118;border:1px solid #29394a;border-radius:14px;padding:12px}.coach-stat b{display:block;font-size:20px}.journal-entry{border-left:3px solid #7d68ff}.coach-snapshot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid #2f4052;background:#101820;border-radius:16px;margin:12px 0}.coach-snapshot-main{min-width:0}.coach-snapshot-kicker{font-size:10px;letter-spacing:.12em;color:#8fc0ff;font-weight:900;margin-bottom:4px}.coach-snapshot-text{font-size:14px;font-weight:800;line-height:1.35}.coach-snapshot-arrow{font-size:20px;color:#8fc0ff;flex:0 0 auto}.coach-snapshot:active{transform:scale(.99)}


/* v2.2 Gym Experience polish */
@property --pct{syntax:'<number>';inherits:false;initial-value:0}
.card{box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .18s ease,border-color .18s ease}
.btn{min-height:50px;transition:transform .12s ease,filter .12s ease}.btn:active{transform:scale(.985);filter:brightness(.94)}
.input,.assist-input,.rep-input,.kg-input{font-size:16px}
.club-ring{position:relative;--pct:0;transition:--pct 1.1s cubic-bezier(.2,.8,.2,1);background:conic-gradient(var(--red) calc(var(--pct)*1%),#26303c 0)}
.coach-snapshot{transition:transform .15s ease,border-color .15s ease}.coach-snapshot:active{transform:scale(.99)}
.set,.extra-set{position:relative;overflow:hidden;touch-action:pan-y;transition:transform .18s ease,background .18s ease,border-color .18s ease}
.set::after,.extra-set::after{content:'SWIPE TO COMPLETE';position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;background:linear-gradient(90deg,transparent,rgba(53,208,127,.25));color:#98f3bf;font-size:10px;font-weight:900;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .15s ease}
.set.swiping::after,.extra-set.swiping::after{opacity:1}.set.swiping,.extra-set.swiping{transform:translateX(-8px)}
.previous-hint{font-size:10px;color:#98f3bf;margin-top:3px;font-weight:800}
.preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:10000;display:flex;align-items:flex-end;padding:14px;backdrop-filter:blur(8px)}
.preview-panel{width:100%;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#18202a,#0e1319);border:1px solid #344152;border-radius:24px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.55);max-height:88vh;overflow:auto}
.preview-list{margin:12px 0}.preview-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #27313e}.preview-item:last-child{border-bottom:0}.preview-icon{width:30px;height:30px;border-radius:10px;background:#222b36;display:grid;place-items:center;flex:0 0 30px}.preview-target{font-weight:900;color:#fff}.preview-meta{font-size:12px;color:var(--muted);margin-top:2px}
.preview-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;position:sticky;bottom:-18px;background:linear-gradient(transparent,#0e1319 25%);padding-top:18px}
.celebration{position:fixed;inset:0;pointer-events:none;z-index:11000;overflow:hidden}.confetti{position:absolute;top:-20px;width:9px;height:16px;border-radius:2px;animation:confettiFall 1.8s ease-in forwards}.celebration-burst{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);background:#111822;border:1px solid #3a4656;border-radius:999px;padding:14px 20px;font-weight:900;box-shadow:var(--shadow);animation:burst .9s ease forwards;z-index:11001;pointer-events:none}
@keyframes confettiFall{to{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:.2}}@keyframes burst{45%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.summary-panel{animation:panelUp .28s ease both}@keyframes panelUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.club-ring,.card,.btn,.set{transition:none!important}.confetti,.celebration-burst,.summary-panel{animation:none!important}}


/* v2.3 Effortless Logging */
.rep-input,.assist-input{touch-action:manipulation}
.rep-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.rep-picker-panel{width:min(520px,100%);background:linear-gradient(180deg,#1b222d,#10141a);border:1px solid #344052;border-radius:24px;padding:16px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.rep-picker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}
.rep-choice{border:1px solid #344052;background:#0b1016;color:#fff;border-radius:14px;padding:13px 4px;font-weight:900;font-size:17px}
.rep-choice.active{background:var(--red);border-color:var(--red)}
.quick-weight{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:5px}
.quick-weight button{border:1px solid #303b49;background:#111720;color:#dce4ee;border-radius:9px;padding:4px 8px;font-weight:900;font-size:12px}
.next-focus{animation:nextPulse .75s ease}
@keyframes nextPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 3px rgba(90,166,255,.45)}}
.timer-hint{font-size:11px;color:#93a0b0;margin-top:6px}


/* v2.4 Coach's Observations */
.observation-feed{display:grid;gap:10px;margin-top:12px}

function saveProfiles(list){localStorage.setItem(PROFILES_KEY,JSON.stringify(list))}
function activeProfileId(){const profiles=loadProfiles();let id=localStorage.getItem(ACTIVE_PROFILE_KEY);if(!id||!profiles.find(p=>p.id===id)){id=profiles[0].id;localStorage.setItem(ACTIVE_PROFILE_KEY,id)}return id}

function draftKey(){return 'strengthosWorkoutDraft:'+activeProfileId()}

function acc(name,reps,total,opts={}){return {kind:'accessory',name,reps:String(reps||''),sets:setsFrom(total,parseInt(reps))||opts.sets||3,totalReps:total||'',role:opts.role||'assistance',amrap:!!opts.amrap,note:opts.note||''}}
function benchMirror(type,reps,total){return {kind:'benchMirror',lift:'bench',type,label:`Bench ${type} Day`,reps:String(reps),sets:setsFrom(total,reps),totalReps:total,note:'Second weekly bench: mirror first bench day. Touch-and-go; choose by feel. PR only on corresponding strength days.'}}

function w531Main(lift,week,label){
 const schemes={
  1:{ramp:[.65,.75,.85],repsRamp:['5','5','5+'],note:'5s week — final set is a clean rep PR, never a grinder.'},
  2:{ramp:[.70,.80,.90],repsRamp:['3','3','3+'],note:'3s week — leave a rep in reserve if technique slows.'},
  3:{ramp:[.75,.85,.95],repsRamp:['5','3','1+'],note:'5/3/1 week — strong, controlled final set.'},
  4:{ramp:[.40,.50,.60],repsRamp:['5','5','5'],note:'Deload — move quickly and finish fresh.',amrapTop:false}
 };
 const sc=schemes[week]||schemes[1];
 return {kind:'main',lift,type:week===4?'Deload':'Strength',label:label||`${LIFTS[lift]} 5/3/1`,pct:sc.ramp[0],ramp:sc.ramp,reps:sc.repsRamp[0],repsRamp:sc.repsRamp,sets:3,totalReps:'',note:sc.note,amrapTop:sc.amrapTop!==false};
}

function collectWorkoutDraft(){const workout=document.getElementById('workout');if(!workout||!workout.innerHTML)return null;syncExtraInputs();syncExtraMainInputs();const fields={};workout.querySelectorAll('input[id^="reps-"],input[id^="accw-"],input[id^="accr-"]').forEach(el=>fields[el.id]=el.value);return {version:3,position:state.position,title:current().title,custom:!!workoutDraft?.custom,quickType:workoutDraft?.quickType||'',startedAt:workoutDraft?.startedAt||new Date().toISOString(),savedAt:new Date().toISOString(),fields,completed:[...workout.querySelectorAll('.set.done')].map(el=>el.id),setCounts:collectProgrammedSetCounts(),note:document.getElementById('sessionNote')?.value||'',rating:Number(selectedSessionRating||workoutDraft?.rating||0),extraExercises:JSON.parse(JSON.stringify(extraExercises)),extraMainLifts:JSON.parse(JSON.stringify(extraMainLifts)),restEndAt:restEndAt||0,pausedAt:workoutDraft?.pausedAt||null,totalPausedMs:Number(workoutDraft?.totalPausedMs||0)}}
function saveWorkoutDraftNow(){if(draftRestoring||!activeWorkoutDraft())return;const d=collectWorkoutDraft();if(!d)return;workoutDraft=d;localStorage.setItem(draftKey(),JSON.stringify(d));updateAutosaveStatus()}
function queueWorkoutAutosave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(saveWorkoutDraftNow,250)}
function updateAutosaveStatus(){const el=document.getElementById('autosaveStatus');if(!el)return;const when=workoutDraft?.savedAt?new Date(workoutDraft.savedAt):null;el.textContent=when?'Autosaved '+when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'Autosave ready'}
function restoreDraftToDom(){selectedSessionRating=Number(workoutDraft?.rating||0);const d=workoutDraft;if(!d||d.position!==state.position)return;draftRestoring=true;Object.entries(d.fields||{}).forEach(([id,value])=>{const el=document.getElementById(id);if(el)el.value=value});(d.completed||[]).forEach(id=>document.getElementById(id)?.classList.add('done'));const note=document.getElementById('sessionNote');if(note)note.value=d.note||'';draftRestoring=false;updateAutosaveStatus();resumeRestTimer()}
function offerWorkoutResume(){const d=workoutDraft;if(!draftHasProgress(d))return;if(!d.custom&&d.position!==state.position){clearWorkoutDraft();return}const saved=d.savedAt?new Date(d.savedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'earlier';if(confirm(`Resume your unfinished ${d.title||'workout'} saved at ${saved}?`)){extraExercises=JSON.parse(JSON.stringify(d.extraExercises||[]));extraMainLifts=JSON.parse(JSON.stringify(d.extraMainLifts||[]));nav('workout');enableWakeLock()}else if(confirm('Discard the unfinished workout?'))clearWorkoutDraft()}

function programmeWorkout(idx){const base=PROGRAMME[Math.max(0,Math.min(Number(idx)||0,PROGRAMME.length-1))];const o=state.programmeOverrides?.[String(base.globalIndex)];if(!o)return base;return {...base,title:o.title||base.title,items:JSON.parse(JSON.stringify(o.items||base.items)),programmeEdited:true}}
function current(){if(workoutDraft?.custom)return {title:workoutDraft.title||'Quick Workout',phase:'Additional session',block:'—',items:[]};const arr=activeProgrammeWorkouts();return arr[Math.max(0,Math.min(state.position,arr.length-1))]||arr[0]}
function activeWorkoutDraft(){return !!(workoutDraft&&workoutDraft.startedAt&&(workoutDraft.custom||workoutDraft.position===state.position))}
function workoutIsPaused(){return !!(activeWorkoutDraft()&&workoutDraft.pausedAt)}
function workoutElapsedMs(end=Date.now()){if(!activeWorkoutDraft())return 0;const started=new Date(workoutDraft.startedAt).getTime();const pausedNow=workoutDraft.pausedAt?Math.max(0,end-new Date(workoutDraft.pausedAt).getTime()):0;return Math.max(0,end-started-Number(workoutDraft.totalPausedMs||0)-pausedNow)}
function activeWorkoutMinutes(){if(!activeWorkoutDraft())return 0;return Math.max(0,Math.floor(workoutElapsedMs()/60000))}
function persistWorkoutDraft(){if(workoutDraft)localStorage.setItem(draftKey(),JSON.stringify(workoutDraft))}
function pauseWorkout(){if(!activeWorkoutDraft()||workoutIsPaused())return;saveWorkoutDraftNow();workoutDraft.pausedAt=new Date().toISOString();workoutDraft.savedAt=new Date().toISOString();persistWorkoutDraft();releaseWakeLock();render();toast('Workout paused')}
function resumeWorkout(){if(!activeWorkoutDraft()){startWorkout();return}if(workoutDraft.pausedAt){workoutDraft.totalPausedMs=Number(workoutDraft.totalPausedMs||0)+Math.max(0,Date.now()-new Date(workoutDraft.pausedAt).getTime());workoutDraft.pausedAt=null;workoutDraft.savedAt=new Date().toISOString();persistWorkoutDraft()}extraExercises=JSON.parse(JSON.stringify(workoutDraft.extraExercises||[]));extraMainLifts=JSON.parse(JSON.stringify(workoutDraft.extraMainLifts||[]));enableWakeLock();nav('workout')}
function resetActiveWorkout(){if(!activeWorkoutDraft())return;if(!confirm('Discard this workout and reset the timer? All unsaved sets, reps and notes from this session will be cleared.'))return;clearWorkoutDraft();extraExercises=[];extraMainLifts=[];selectedSessionRating=0;releaseWakeLock();render();toast('Workout reset')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function nav(tab){if(document.getElementById('workout')?.classList.contains('active'))saveWorkoutDraftNow();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(tab).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.tab));
function currentWidgetTab(){return document.querySelector('.screen.active')?.id}
function updateDashboardTopBtn(){const tab=currentWidgetTab(),btn=document.getElementById('dashboardTopBtn'),menu=document.getElementById('dashboardTopMenu');if(!btn||!menu)return;if(tab==='progress'||tab==='coach'){btn.classList.remove('hidden');const editing=dashboardEditPage===tab,menuOpen=dashboardMenuPage===tab;menu.className=`dashboard-menu ${menuOpen?'open':''}`;menu.innerHTML=`<button class="btn secondary mini" type="button" onclick="toggleDashboardLayoutEdit('${tab}')">${editing?'Done editing':'Edit layout'}</button><button class="btn secondary mini" type="button" onclick="setDashboardSections('${tab}',true)">Expand all</button><button class="btn secondary mini" type="button" onclick="setDashboardSections('${tab}',false)">Collapse all</button><button class="btn secondary mini" type="button" onclick="resetDashboardLayout('${tab}')">Reset layout</button>`}else{btn.classList.add('hidden');menu.classList.remove('open')}}
function render(){renderHome();renderWorkout();renderProgramme();renderProgress();renderCoach();renderSettings();updateDashboardTopBtn();}
function pctComplete(){return Math.round((state.position/activeProgrammeLength())*100)}
function total(){return ['deadlift','squat','bench','ohp'].reduce((a,l)=>a+(state.oneRMs[l]||0),0)}
function powerTotal(){return ['deadlift','squat','bench'].reduce((a,l)=>a+(state.oneRMs[l]||0),0)}
function epley(weight,reps){weight=Number(weight||0);reps=Number(reps||0);if(!weight||!reps)return 0;return Math.round((weight*(1+reps/30))*10)/10}
function repsToBeat(lift,weight){const max=Number(state.oneRMs[lift]||0);weight=Number(weight||0);if(!max||!weight)return null;return Math.max(1, Math.floor(((max/weight)-1)*30)+1)}
function restSecondsFor(type,kind){if(kind==='accessory')return 90;if(type==='Speed')return 60;if(type==='Rep')return 90;if(type==='Strength'||type==='Power')return 180;return 120}

let wakeLock=null, workoutAwake=false;
async function enableWakeLock(){workoutAwake=true;try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');toast('Gym Mode on • screen stays awake')}}catch(e){toast('Gym Mode unavailable on this browser')}}
async function releaseWakeLock(){workoutAwake=false;try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveWorkoutDraftNow();if(document.visibilityState==='visible'){if(workoutAwake)enableWakeLock();resumeRestTimer()}});
window.addEventListener('pagehide',saveWorkoutDraftNow);

function restCompleteAlert(){try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){} try{const C=window.AudioContext||window.webkitAudioContext;if(C){const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.06;osc.connect(gain);gain.connect(ctx.destination);osc.start();setTimeout(()=>{osc.stop();ctx.close()},180)}}catch(e){}}
function plateCalc(weight){weight=Number(weight||0);const bar=20;let side=(weight-bar)/2;if(side<=0)return 'bar only';const plates=[25,20,15,10,5,2.5,1.25];let used=[];for(const p of plates){while(side>=p-.01){used.push(p);side-=p}}return used.length?used.map(fmt).join(' + ')+' each side':'bar only'}
function plateLine(weight){return `<div class="plate-line">Plate calc: <b>${plateCalc(weight)}</b></div>`}
function mainLiftItems(w=current()){return w.items.filter(i=>i.kind==='main'||i.kind==='benchMirror')}
function firstMainItem(w=current()){return mainLiftItems(w).find(i=>i.kind==='main')}
function lastSameSession(){const title=current().title;return [...(state.history||[])].reverse().find(h=>h.title===title)||null}
function bestMainLog(h,lift){if(!h)return null;const logs=(h.mainLogs||[]).filter(x=>x.lift===lift&&Number(x.weight)>0&&Number(x.reps)>0);if(!logs.length)return null;return logs.sort((a,b)=>(Number(b.weight)-Number(a.weight))||(Number(b.reps)-Number(a.reps)))[0]}
function missionText(){const w=current();const fm=firstMainItem(w);if(!fm)return 'Complete the session and keep the movement quality high.';const topWeight=itemWeight(fm,fm.ramp?fm.ramp.length-1:fm.sets-1);const previous=bestMainLog(lastSameSession(),fm.lift);if(fm.type==='Speed')return `Move every rep fast and identical at ${fmt(topWeight)}kg. Quality beats fatigue today.`;if(previous){if(Number(previous.weight)===Number(topWeight))return `Beat last time: ${fmt(Number(previous.weight))}kg × ${previous.reps}. Target ${Number(previous.reps)+1}+ clean reps.`;return `Last time: ${fmt(Number(previous.weight))}kg × ${previous.reps}. Complete today's ${fmt(topWeight)}kg top work with clean reps.`}const beat=repsToBeat(fm.lift,topWeight);if(beat)return `Establish your benchmark at ${fmt(topWeight)}kg. Target ${beat}+ reps for a new estimated 1RM.`;return `Complete ${mainSummary(fm)} with clean reps.`}
function lastLogsForExercise(name){const key=String(name||'').toLowerCase();for(const h of [...(state.history||[])].reverse()){const logs=[...(h.accLogs||[]),...(h.extraLogs||[])].filter(x=>String(x.name||'').toLowerCase()===key&&Number(x.reps)>0);if(logs.length)return {date:h.date,logs}}return null}
function recentLogsForExercise(name,count=3){const key=String(name||'').toLowerCase();const sessions=[];for(const h of [...(state.history||[])].reverse()){const logs=[...(h.accLogs||[]),...(h.extraLogs||[])].filter(x=>String(x.name||'').toLowerCase()===key&&Number(x.reps)>0);if(logs.length){sessions.push({date:h.date,logs,rating:Number(h.rating||0)});if(sessions.length>=count)break}}return sessions}
function coachAccessoryTarget(it){const sessions=recentLogsForExercise(it.name,3);const top=topTarget(it.reps);if(!sessions.length)return {headline:'Set a baseline',detail:`Log every set of ${it.name} so Coach Mode can prescribe the next target.`};const prev=sessions[0];const reps=prev.logs.map(x=>Number(x.reps||0));const weights=prev.logs.map(x=>Number(x.weight||0)).filter(Boolean);const total=reps.reduce((a,b)=>a+b,0);const maxWeight=weights.length?Math.max(...weights):0;if(it.amrap){const best=Math.max(...reps);return {headline:`Target ${best+1}+ reps`,detail:`Last time: ${best} reps. Beat it with the same clean standard.`}}const hitTopEverySession=top&&sessions.every(s=>s.logs.length&&s.logs.map(x=>Number(x.reps||0)).every(r=>r>=top));const feltHard=prev.rating>0&&prev.rating<=2;if(top&&hitTopEverySession&&maxWeight&&!feltHard){const streak=sessions.length;return {headline:`Try ${fmt(r25(maxWeight+(state.settings.roundTo||2.5)))}kg`,detail:`You've hit the top of the rep range for ${streak} session${streak===1?'':'s'} in a row. Take the smallest sensible increase.`}}if(top&&hitTopEverySession&&feltHard){return {headline:`Hold at ${fmt(maxWeight)}kg`,detail:`You hit the top of the range last time, but that session was rated low — repeat the weight before adding load.`}}return {headline:`Beat ${total} total reps`,detail:`Repeat around ${maxWeight?fmt(maxWeight)+'kg':'the same load'} and add at least one clean rep across the sets.`}}
function coachMainTarget(){const fm=firstMainItem();if(!fm)return {headline:'Complete the session',detail:'Keep technique consistent and log the work.'};const topWeight=itemWeight(fm,fm.ramp?fm.ramp.length-1:fm.sets-1);const prev=bestMainLog(lastSameSession(),fm.lift);if(fm.type==='Speed')return {headline:`Own ${fmt(topWeight)}kg`,detail:'Every rep should look the same. Stop chasing fatigue when bar speed drops.'};if(prev&&Number(prev.weight)===Number(topWeight)){return {headline:`Target ${Number(prev.reps)+1}+ reps at ${fmt(topWeight)}kg`,detail:`Last matching session: ${fmt(Number(prev.weight))}kg × ${prev.reps}. One more clean rep is progress.`}}const beat=repsToBeat(fm.lift,topWeight);return {headline:beat?`${beat}+ reps at ${fmt(topWeight)}kg`:`Complete ${mainSummary(fm)}`,detail:beat?'That result would exceed your current estimated 1RM.':'Execute the programmed work without missed reps.'}}
function coachBriefingHtml(compact=false){if(state.settings.coachMode===false)return '';const w=current(),mainTarget=coachMainTarget();const accessories=w.items.filter(x=>x.kind==='accessory').slice(0,compact?2:3);return `<div class="card coach-card"><div class="coach-kicker">COACH MODE</div><div class="coach-focus">${esc(mainTarget.headline)}</div><div class="coach-detail">${esc(mainTarget.detail)}</div>${accessories.length?`<div class="coach-targets">${accessories.map(it=>{const t=coachAccessoryTarget(it);return `<div class="coach-target"><b>${esc(it.name)} — ${esc(t.headline)}</b><span>${esc(t.detail)}</span></div>`}).join('')}</div>`:''}</div>`}
function coachSnapshotHtml(){if(state.settings.coachMode===false)return '';const t=coachMainTarget();return `<button class="coach-snapshot" onclick="nav('coach')" aria-label="Open Coach tab"><div class="coach-snapshot-main"><div class="coach-snapshot-kicker">COACH SNAPSHOT</div><div class="coach-snapshot-text">${esc(t.headline)} — ${esc(t.detail)}</div></div><div class="coach-snapshot-arrow">›</div></button>`}
function loadPreviousAccessory(idx,name){const prev=lastLogsForExercise(name);if(!prev){toast('No previous performance found');return}prev.logs.forEach((x,i)=>{const w=document.getElementById(`accw-${idx}-${i}`),r=document.getElementById(`accr-${idx}-${i}`);if(w)w.value=x.weight||'';if(r)r.value=x.reps||''});queueWorkoutAutosave();toast('Previous sets loaded')}
function loadPreviousExtra(id,name){const prev=lastLogsForExercise(name);const ex=extraExercises.find(x=>String(x.id)===String(id));if(!prev||!ex){toast('No previous performance found');return}ex.bodyweight=prev.logs.every(x=>x.bodyweight);ex.sets=prev.logs.map(x=>({weight:x.weight||'',reps:x.reps||''}));renderExtraExercises();queueWorkoutAutosave();toast('Previous sets loaded')}

function relativeDaysLabel(date){const days=Math.max(0,Math.floor((Date.now()-new Date(date).getTime())/86400000));return days===0?'Today':days===1?'Yesterday':`${days} days ago`}
function missionMeta(){const prev=lastSameSession();if(!prev)return `<div class="mission-stats"><div class="mission-stat"><b>Set today’s benchmark</b><span>No previous matching session</span></div><div class="mission-stat"><b>${state.position+1}/${activeProgrammeLength()}</b><span>Programme position</span></div></div>`;return `<div class="mission-stats"><div class="mission-stat"><b>${relativeDaysLabel(prev.date)}</b><span>Last completed</span></div><div class="mission-stat"><b>${fmt(prev.volume||0)}kg</b><span>Previous volume</span></div></div>`}
function addQuickNote(text,btn){const box=document.getElementById('sessionNote');if(!box)return;const parts=box.value.split(' • ').map(x=>x.trim()).filter(Boolean);const i=parts.indexOf(text);if(i>=0)parts.splice(i,1);else parts.push(text);box.value=parts.join(' • ');btn?.classList.toggle('active',i<0);queueWorkoutAutosave()}
function setSessionRating(n){selectedSessionRating=Number(n)||0;document.querySelectorAll('#sessionRatingStars .rating-star').forEach((b,i)=>b.classList.toggle('selected',i<selectedSessionRating));queueWorkoutAutosave()}

function topTarget(reps){const nums=String(reps||'').match(/\d+/g);return nums?Number(nums[nums.length-1]):null}
function assistanceSuggestion(it){const last=lastAccessoryLog(it.name);const target=topTarget(it.reps);if(!last||!target)return it.amrap?'Beat last AMRAP reps when you can.':'Log weight and reps to build progression.';const reps=last.split('/').map(x=>Number((x.match(/×(\d+)/)||[])[1]||0));const allHit=reps.length && reps.every(r=>r>=target);return allHit?`Progression: you hit the top target last time — try a small weight increase.`:`Progression: beat last total reps before adding weight.`}
let restInterval=null, restLeft=0;

function drawTimer(){const el=document.getElementById('restTimer');if(!el)return;const m=Math.floor(restLeft/60),sec=String(restLeft%60).padStart(2,'0');el.innerHTML=`<div class="row"><div><div class="muted small">Rest timer</div><div class="timer-time">${m}:${sec}</div><div class="timer-hint">Accurate after switching apps or locking your phone.</div></div><span class="tag">StrengthOS</span></div><div class="timer-buttons"><button class="btn secondary mini" onclick="skipTimer()">Skip</button><button class="btn secondary mini" onclick="addTimer(30)">+30s</button><button class="btn secondary mini" onclick="addTimer(-30)">-30s</button></div>`}

function scrollNext(el){const rows=[...document.querySelectorAll('#workout .set')];const i=rows.indexOf(el);const next=rows.slice(i+1).find(x=>!x.classList.contains('done'));if(next){next.scrollIntoView({behavior:'smooth',block:'center'});next.classList.add('next-focus');setTimeout(()=>next.classList.remove('next-focus'),850)}}
function lastSetTargetText(it,weight){if(!it.lift||!weight)return '';const beat=repsToBeat(it.lift,weight);return beat?`Beat current ${LIFTS[it.lift]} 1RM: ${beat}+ reps at ${fmt(weight)}kg`:''}
function collectPotentialPRs(){let prs=[];document.querySelectorAll('[data-pr-lift]').forEach(el=>{const lift=el.dataset.prLift, weight=Number(el.dataset.prWeight), reps=Number(el.value||0);const est=epley(weight,reps);if(est>(state.oneRMs[lift]||0)) prs.push({lift,weight,reps,est});});return prs}
function handlePRs(prs){if(!prs.length)return [];let accepted=[];prs.forEach(pr=>{const old=state.oneRMs[pr.lift];if(confirm(`New estimated ${LIFTS[pr.lift]} 1RM: ${fmt(pr.est)}kg from ${fmt(pr.weight)}kg × ${pr.reps}. Update your 1RM from ${fmt(old)}kg?`)){state.oneRMs[pr.lift]=Math.max(old,Math.round(pr.est));accepted.push({...pr,old,newMax:state.oneRMs[pr.lift],date:new Date().toISOString()});}});state.prs=[...(state.prs||[]),...accepted];return accepted}

 const latestPR=[...(state.prs||[])].slice(-1)[0];
 document.getElementById('home').innerHTML=`

function showQuickWorkoutPicker(){document.getElementById('quickWorkoutPicker')?.remove();const modal=document.createElement('div');modal.id='quickWorkoutPicker';modal.className='preview-overlay';modal.innerHTML=`<div class="preview-panel"><div class="muted small">ADDITIONAL SESSION</div><div class="title">What are you doing?</div><div class="muted">This will be saved in your history without advancing the programme.</div><div class="quick-type-grid">${['Mobility & Stretching','Pull-ups & Arms','Conditioning','Technique Work','Recovery Session','Custom Workout'].map(x=>`<button class="quick-type" onclick="beginQuickWorkout('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div><button class="btn secondary" onclick="document.getElementById('quickWorkoutPicker')?.remove()">Cancel</button></div>`;document.body.appendChild(modal)}
async function beginQuickWorkout(type){document.getElementById('quickWorkoutPicker')?.remove();let title=type;if(type==='Custom Workout'){const entered=await askText('Name this workout','Extra Workout');if(entered===null)return;title=entered.trim()||'Extra Workout'}workoutDraft={version:2,position:state.position,title,custom:true,quickType:type,startedAt:new Date().toISOString(),savedAt:new Date().toISOString(),pausedAt:null,totalPausedMs:0,fields:{},completed:[],note:'',extraExercises:[],setCounts:{},restEndAt:0};localStorage.setItem(draftKey(),JSON.stringify(workoutDraft));extraExercises=[];enableWakeLock();nav('workout');toast('Add your exercises below')}
function nextSummary(){const arr=activeProgrammeWorkouts(),n=arr[Math.min(state.position+1,arr.length-1)];return n?`<b>${n.title}</b><div class="muted small">${n.phase} • Block ${n.block} • Workout ${Math.min(state.position+2,activeProgrammeLength())} / ${activeProgrammeLength()}</div>`:'<div class="muted">Cycle complete.</div>'}
function histSummary(h){return `<b>${h.title}</b><div class="muted small">${h.phase} • ${new Date(h.date).toLocaleString()}</div>`}
function itemWeight(it,setIndex=0){if(it.kind==='benchMirror')return null;if(it.kind!=='main')return null;const pct=it.ramp?it.ramp[setIndex]||it.pct:it.pct;return weightFor(it.lift,pct,false)}
function mainSummary(it){if(it.kind==='benchMirror')return `${it.sets} × ${it.reps} • by feel`; if(it.ramp)return it.ramp.map((p,i)=>`${fmt(weightFor(it.lift,p))}×${it.repsRamp?.[i]||it.reps}`).join(' / ');return `${it.sets} × ${it.reps} @ ${fmt(weightFor(it.lift,it.pct))}kg (${Math.round(it.pct*1000)/10}%)`}
function warmups(lift,target){let bar=lift==='ohp'?20:20; let arr=[{w:bar,r:5},{w:r25(target*.45),r:5},{w:r25(target*.65),r:3},{w:r25(target*.8),r:1}]; return arr.filter((x,i,a)=>x.w>0 && (i===0||x.w!==a[i-1].w) && x.w<target)}
function programmedSetCount(kind,idx,fallback){const key=`${kind}${idx}`;const saved=Number(workoutDraft?.setCounts?.[key]);return Number.isFinite(saved)&&saved>0?saved:Math.max(1,Number(fallback)||1)}
function collectProgrammedSetCounts(){const counts={};document.querySelectorAll('#workout [id^="set-m"],#workout [id^="set-a"]').forEach(el=>{const m=el.id.match(/^set-([ma])(\d+)-(\d+)$/);if(!m)return;const key=`${m[1]}${m[2]}`;counts[key]=Math.max(Number(counts[key]||0),Number(m[3])+1)});return {...(workoutDraft?.setCounts||{}),...counts}}
function changeProgrammedSets(kind,idx,delta,fallback){if(!activeWorkoutDraft())return;saveWorkoutDraftNow();workoutDraft.setCounts={...(workoutDraft.setCounts||{})};const key=`${kind}${idx}`;const current=programmedSetCount(kind,idx,fallback);workoutDraft.setCounts[key]=Math.max(1,current+delta);workoutDraft.savedAt=new Date().toISOString();persistWorkoutDraft();renderWorkout();toast(delta>0?'Set added':'Set removed')}
function renderWorkout(){const w=current();let mainItems=w.items.filter(i=>i.kind==='main'||i.kind==='benchMirror');let accItems=w.items.filter(i=>i.kind==='accessory');let firstMain=mainItems.find(i=>i.kind==='main');let target=firstMain?itemWeight(firstMain, firstMain.ramp?firstMain.ramp.length-1:0):null;document.getElementById('workout').innerHTML=`
<div class="card hero"><div class="row"><div><div class="muted small">${w.phase} • Block ${w.block}${Number.isFinite(w.dayIndex)?` • Day ${w.dayIndex+1}`:''}</div><div class="title">${w.title}</div><div class="muted">StrengthOS session</div><div class="autosave-status" id="autosaveStatus">Autosave ready</div></div><span class="wake">Awake</span></div><div class="mission"><b>Today’s Mission</b><span>${missionText()}</span>${missionMeta()}</div></div>
${coachBriefingHtml(false)}
${firstMain?`<div class="card"><div class="h2">Warm-up</div>${warmups(firstMain.lift,target).map((s,i)=>setRow(`w${i}`,`${fmt(s.w)}kg × ${s.r}`,false)).join('')}</div>`:''}
<div class="card"><div class="h2">Main Work</div>${mainItems.map((it,idx)=>mainBlock(it,idx)).join('')}</div>
<div class="card"><div class="h2">Accessories</div>${accItems.map((it,idx)=>accessoryBlock(it,idx)).join('')}</div>
<div class="card"><div class="extra-head"><div><div class="h2">Off-Plan Main Lifts</div><div class="muted small">Log extra deadlift, squat, bench or press sets outside the programme. These count toward your 1RM and PRs.</div></div><button class="btn secondary mini" onclick="showMainLiftPicker()">+ Add</button></div><div id="mainLiftPicker" class="exercise-picker hidden"><div class="quick-type-grid">${Object.keys(LIFTS).map(l=>`<button class="quick-type" onclick="addExtraMainLift('${l}')">${esc(LIFTS[l])}</button>`).join('')}</div><button class="btn secondary mini" onclick="hideMainLiftPicker()">Cancel</button></div><div id="extraMainLifts"><div class="empty-extra">No off-plan lifts added yet.</div></div></div>
<div class="card"><div class="extra-head"><div><div class="h2">Extra Exercises</div><div class="muted small">Add anything you do after the programmed session. These sets are saved in your history and session volume.</div></div><button class="btn secondary mini" onclick="showExercisePicker()">+ Add</button></div><div id="exercisePicker" class="exercise-picker hidden">${favouritePickerHtml()}<input id="exerciseSearch" class="input" list="exerciseOptions" placeholder="Search or type a custom exercise"><datalist id="exerciseOptions">${EXERCISE_LIBRARY.map(x=>`<option value="${x}"></option>`).join('')}</datalist><div class="two-buttons"><button class="btn secondary mini" onclick="hideExercisePicker()">Cancel</button><button class="btn mini" onclick="addExtraExercise()">Add Exercise</button></div></div><div id="extraExercises"><div class="empty-extra">No extra exercises added yet.</div></div></div>
<div class="card"><div class="h2">Rate today’s workout</div><div class="session-rating"><div class="rating-help">How did the session go overall? Rating is optional.</div><div class="rating-stars" id="sessionRatingStars">${[1,2,3,4,5].map(n=>`<button type="button" class="rating-star ${Number(workoutDraft?.rating||selectedSessionRating)>=n?'selected':''}" onclick="setSessionRating(${n})" aria-label="Rate ${n} out of 5">★</button>`).join('')}</div></div><div class="h2" style="margin-top:14px">Coach’s Notebook</div><div class="muted small">Optional: note anything that went well or affected the session.</div><textarea id="sessionNote" class="input note" placeholder="What went well? Anything to watch next time?"></textarea><button class="btn green" onclick="finishWorkout()">FINISH WORKOUT</button>${workoutDraft?.custom?'':`<button class="btn secondary" onclick="skipForward()">Skip to next workout</button>`}</div>`;if(workoutDraft?.position===state.position&&extraExercises.length===0)extraExercises=JSON.parse(JSON.stringify(workoutDraft.extraExercises||[]));if(workoutDraft?.position===state.position&&extraMainLifts.length===0)extraMainLifts=JSON.parse(JSON.stringify(workoutDraft.extraMainLifts||[]));renderExtraExercises();renderExtraMainLifts();restoreDraftToDom()}
function setRow(id,txt,done=false,opts={}){const reps=opts.reps||'';const wt=opts.weight||'';const prAttrs=opts.pr?`data-pr-lift="${opts.lift}" data-pr-weight="${wt}"`:'';const target=opts.target?`<div class="prline">${opts.target}</div>`:'';const plates=opts.plate?plateLine(wt):'';return `<div class="set ${done?'done':''}" id="set-${id}"><button class="check" onclick="toggleSet('${id}',${opts.rest||120})">✓</button><div><b>${txt}</b>${target}${plates}</div><div class="repbox">${opts.repInput?`<input ${prAttrs} class="rep-input rep-tap" id="reps-${id}" inputmode="none" readonly placeholder="reps" value="${reps}">`:opts.label||'<span class="muted small">set</span>'}</div></div>`}
function mainBlock(it,idx){let count=programmedSetCount('m',idx,it.sets||1);let html=`<div class="listitem"><div class="row"><div><b>${it.label}</b><div class="muted small">${mainSummary(it)}</div>${it.note?`<div class="warn small">${it.note}</div>`:''}</div><span class="tag">${it.type}</span></div>`;for(let s=0;s<count;s++){if(it.kind==='benchMirror'){html+=setRow(`m${idx}-${s}`,`Set ${s+1}: Bench by feel`,false,{repInput:true,reps:it.reps,rest:restSecondsFor(it.type,'main'),label:'reps'});continue}let wt=itemWeight(it,Math.min(s,(it.sets||1)-1));let pct=it.ramp&&s<it.ramp.length?` (${Math.round((it.ramp[s]||it.pct)*1000)/10}%)`:'';let isTop=(s===count-1&&(it.type==='Strength'||it.type==='Power'||it.type==='Rep')&&it.amrapTop!==false);let target=isTop?lastSetTargetText(it,wt):'';let prescribed=it.repsRamp?.[Math.min(s,it.repsRamp.length-1)]||it.reps;html+=setRow(`m${idx}-${s}`,`Set ${s+1}: ${fmt(wt)}kg ×${pct}`,false,{repInput:true,reps:prescribed,weight:wt,lift:it.lift,pr:isTop,target,rest:restSecondsFor(it.type,'main'),plate:true})}html+=`<div class="two-buttons set-controls"><button class="btn ghost mini" onclick="changeProgrammedSets('m',${idx},1,${it.sets||1})">+ Add Set</button><button class="btn ghost mini" onclick="changeProgrammedSets('m',${idx},-1,${it.sets||1})" ${count<=1?'disabled':''}>− Remove Set</button></div>`;if((it.type==='Strength'||it.type==='Power')&&it.amrapTop!==false)html+=`<div class="warn small">Top set: enter reps. If you beat your estimated 1RM, StrengthOS will offer to update it.</div>`;return html+'</div>'}
function accessoryBlock(it,idx){let last=lastAccessoryLog(it.name);let lastLine=last?`<div class="muted small">Last time: ${last}</div>`:'';const coach=state.settings.coachMode===false?null:coachAccessoryTarget(it);let fallback=it.amrap?1:(it.sets||3),sets=programmedSetCount('a',idx,fallback);let html=`<div class="listitem accessory ${it.amrap?'amrap':''} ${it.role==='variation'?'variation':''}"><div class="row"><div><b>${it.name}</b><div class="muted small">Target reps: ${it.amrap?'AMRAP':it.reps}${it.totalReps?` • target total ${it.totalReps}`:''}</div>${lastLine}${coach?`<div class="prline"><span class="coach-badge">Coach</span> ${esc(coach.headline)} — ${esc(coach.detail)}</div>`:`<div class="prline">${assistanceSuggestion(it)}</div>`}${it.note?`<div class="muted small">${it.note}</div>`:''}${last?`<button class="btn ghost load-last" onclick="loadPreviousAccessory(${idx},'${esc(it.name).replace(/&#39;/g,"\\'")}')">Use last sets</button>`:''}</div><span class="tag">${it.role}</span></div>`;for(let s=0;s<sets;s++){html+=`<div class="set assist-grid" id="set-a${idx}-${s}"><div><b>${it.amrap?`AMRAP ${s+1}`:`Set ${s+1}`}</b><div class="muted small">${it.amrap?'Clean reps to failure':`Target (${it.reps})`}</div>${previousWeightFor(it.name,s)?'<div class="previous-hint">Last weight pre-filled</div>':''}</div><div><input class="assist-input" id="accw-${idx}-${s}" inputmode="decimal" placeholder="kg" value="${previousWeightFor(it.name,s)}" data-acc-name="${it.name}" data-acc-set="${s+1}"><div class="quick-weight"><button type="button" onclick="nudgeWeight('accw-${idx}-${s}',-${state.settings.roundTo||2.5})">−</button><button type="button" onclick="copyWeightDown('accw-${idx}-${s}')">↧</button><button type="button" onclick="nudgeWeight('accw-${idx}-${s}',${state.settings.roundTo||2.5})">+</button></div></div><input class="assist-input rep-tap" id="accr-${idx}-${s}" inputmode="none" placeholder="reps" data-acc-name="${it.name}" data-acc-set="${s+1}" readonly><button class="check" onclick="toggleSet('a${idx}-${s}',${restSecondsFor('', 'accessory')})">✓</button></div>`}html+=`<div class="two-buttons set-controls"><button class="btn ghost mini" onclick="changeProgrammedSets('a',${idx},1,${fallback})">+ Add Set</button><button class="btn ghost mini" onclick="changeProgrammedSets('a',${idx},-1,${fallback})" ${sets<=1?'disabled':''}>− Remove Set</button></div>`;return html+'</div>'}
function lastAccessoryLog(name){let hist=[...(state.history||[])].reverse();for(const h of hist){let logs=(h.accLogs||[]).filter(x=>x.name===name&&x.weight&&x.reps);if(logs.length)return logs.map(x=>`${fmt(Number(x.weight))}×${x.reps}`).join(' / ')}return ''}
const EXERCISE_LIBRARY=['Pull Ups','Chin Ups','Weighted Pull Ups','Lat Pulldown','Landmine Row','DB Row','Cable Row','Barbell Row','Face Pulls','Band Pull Aparts','DB Bicep Curl','Hammer Curl','EZ Bar Curl','Cable Curl','Preacher Curl','Dips','Tricep Pushdown','DB Tricep Extension','Skull Crusher','Lateral Raise','Rear Delt Fly','DB Shoulder Press','Leg Extension','Leg Curl','Calf Raise','Romanian Deadlift','Back Extension','Ab Wheel','Hanging Leg Raise','Plank','Farmer Carry'];
let extraExercises=[];
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function exerciseFavourites(){return Array.isArray(state.settings.exerciseFavourites)?state.settings.exerciseFavourites:[]}
function isFavouriteExercise(name){return exerciseFavourites().some(x=>x.toLowerCase()===String(name).toLowerCase())}
function toggleExerciseFavourite(name){const clean=String(name||'').trim();if(!clean)return;let fav=[...exerciseFavourites()];const i=fav.findIndex(x=>x.toLowerCase()===clean.toLowerCase());if(i>=0)fav.splice(i,1);else fav.unshift(clean);state.settings.exerciseFavourites=fav.slice(0,20);save();renderWorkout();toast(i>=0?'Removed from favourites':'Added to favourites')}
function favouritePickerHtml(){const fav=exerciseFavourites();return fav.length?`<div class="muted small">Favourites</div><div class="favorite-chips">${fav.map(x=>`<button class="favorite-chip" onclick="addExtraExerciseByName('${esc(x).replace(/&#39;/g,"\'")}')">★ ${esc(x)}</button>`).join('')}</div>`:''}
function addExtraExerciseByName(name){const clean=String(name||'').trim();if(!clean)return;extraExercises.push({id:Date.now()+Math.random(),name:clean,bodyweight:false,sets:[{weight:previousWeightFor(clean,0),reps:''}]});hideExercisePicker();renderExtraExercises();queueWorkoutAutosave()}
function showExercisePicker(){document.getElementById('exercisePicker')?.classList.remove('hidden');setTimeout(()=>document.getElementById('exerciseSearch')?.focus(),50)}
function hideExercisePicker(){document.getElementById('exercisePicker')?.classList.add('hidden')}
function addExtraExercise(){const input=document.getElementById('exerciseSearch');const name=(input?.value||'').trim();if(!name){toast('Enter an exercise name');return}if(input)input.value='';addExtraExerciseByName(name)}
function removeExtraExercise(id){extraExercises=extraExercises.filter(x=>String(x.id)!==String(id));renderExtraExercises();queueWorkoutAutosave()}
function addExtraSet(id){const ex=extraExercises.find(x=>String(x.id)===String(id));if(!ex)return;syncExtraInputs();ex.sets.push({weight:'',reps:''});renderExtraExercises();queueWorkoutAutosave()}
function removeExtraSet(id,index){syncExtraInputs();const ex=extraExercises.find(x=>String(x.id)===String(id));if(!ex)return;ex.sets.splice(index,1);if(!ex.sets.length)ex.sets.push({weight:'',reps:''});renderExtraExercises();queueWorkoutAutosave()}
function toggleExtraBodyweight(id,checked){syncExtraInputs();const ex=extraExercises.find(x=>String(x.id)===String(id));if(!ex)return;ex.bodyweight=!!checked;renderExtraExercises();queueWorkoutAutosave()}
function syncExtraInputs(){extraExercises.forEach(ex=>ex.sets.forEach((set,i)=>{const w=document.getElementById(`extraw-${ex.id}-${i}`),r=document.getElementById(`extrar-${ex.id}-${i}`);if(w)set.weight=w.value;if(r)set.reps=r.value}))}
function lastExtraLog(name){for(const h of [...(state.history||[])].reverse()){const logs=(h.extraLogs||[]).filter(x=>x.name===name&&x.reps);if(logs.length)return logs.map(x=>`${x.bodyweight?'BW':fmt(Number(x.weight||0))+'kg'}×${x.reps}`).join(' / ')}return ''}
function coachExtraTarget(name){const prev=lastLogsForExercise(name);if(!prev)return 'Set a baseline today.';const best=prev.logs.reduce((a,x)=>Number(x.reps||0)>Number(a.reps||0)?x:a,prev.logs[0]);if(best.bodyweight)return `Beat ${best.reps} reps`;return `Beat ${fmt(Number(best.weight||0))}kg × ${best.reps}, or add a rep across the sets` }
function renderExtraExercises(){const host=document.getElementById('extraExercises');if(!host)return;if(!extraExercises.length){host.innerHTML='<div class="empty-extra">No extra exercises added yet.</div>';return}host.innerHTML=extraExercises.map(ex=>{const last=lastExtraLog(ex.name);return `<div class="listitem extra-exercise"><div class="row"><div><b>${esc(ex.name)}</b>${last?`<div class="muted small">Last time: ${esc(last)}</div><div class="prline"><span class="coach-badge">Coach</span> ${esc(coachExtraTarget(ex.name))}</div><button class="btn ghost load-last" onclick="loadPreviousExtra('${ex.id}','${esc(ex.name).replace(/&#39;/g,"\'")}')">Use last sets</button>`:'<div class="muted small">No previous performance logged.</div>'}</div><div><button class="star-btn" aria-label="Favourite exercise" onclick="toggleExerciseFavourite('${esc(ex.name).replace(/&#39;/g,"\'")}')">${isFavouriteExercise(ex.name)?'★':'☆'}</button><button class="remove-link" onclick="removeExtraExercise('${ex.id}')">Remove</button></div></div><label class="bodyweight-row"><input type="checkbox" ${ex.bodyweight?'checked':''} onchange="toggleExtraBodyweight('${ex.id}',this.checked)">Bodyweight exercise</label>${ex.sets.map((set,i)=>`<div class="set extra-set" id="set-x${ex.id}-${i}"><div><b>Set ${i+1}</b><div class="muted small">${ex.bodyweight?'Bodyweight':'Weight × reps'}</div></div><div><input class="assist-input" id="extraw-${ex.id}-${i}" inputmode="decimal" placeholder="${ex.bodyweight?'BW':'kg'}" value="${ex.bodyweight?'':esc(set.weight)}" ${ex.bodyweight?'disabled':''}><div class="quick-weight ${ex.bodyweight?'hidden':''}"><button type="button" onclick="nudgeWeight('extraw-${ex.id}-${i}',-${state.settings.roundTo||2.5})">−</button><button type="button" onclick="copyWeightDown('extraw-${ex.id}-${i}')">↧</button><button type="button" onclick="nudgeWeight('extraw-${ex.id}-${i}',${state.settings.roundTo||2.5})">+</button></div></div><input class="assist-input rep-tap" id="extrar-${ex.id}-${i}" inputmode="none" placeholder="reps" value="${esc(set.reps)}" readonly><button class="check" onclick="toggleSet('x${ex.id}-${i}',90)">✓</button>${ex.sets.length>1?`<button class="remove-link" style="grid-column:1/-1;justify-self:end" onclick="removeExtraSet('${ex.id}',${i})">Remove set</button>`:''}</div>`).join('')}<button class="btn ghost mini" onclick="addExtraSet('${ex.id}')">+ Add Set</button></div>`}).join('')}
function collectExtraLogs(){syncExtraInputs();let logs=[];extraExercises.forEach(ex=>ex.sets.forEach((set,i)=>{if(String(set.reps||'').trim()||String(set.weight||'').trim())logs.push({id:`extra-${ex.id}-${i}`,name:ex.name,set:i+1,bodyweight:!!ex.bodyweight,weight:ex.bodyweight?'':set.weight,reps:set.reps})}));return logs}

let extraMainLifts=[];
function showMainLiftPicker(){document.getElementById('mainLiftPicker')?.classList.remove('hidden')}
function hideMainLiftPicker(){document.getElementById('mainLiftPicker')?.classList.add('hidden')}
function addExtraMainLift(lift){if(!LIFTS[lift])return;hideMainLiftPicker();extraMainLifts.push({id:Date.now()+Math.random(),lift,sets:[{weight:'',reps:''}]});renderExtraMainLifts();queueWorkoutAutosave()}
function removeExtraMainLift(id){extraMainLifts=extraMainLifts.filter(x=>String(x.id)!==String(id));renderExtraMainLifts();queueWorkoutAutosave()}
function addExtraMainSet(id){const ex=extraMainLifts.find(x=>String(x.id)===String(id));if(!ex)return;syncExtraMainInputs();ex.sets.push({weight:'',reps:''});renderExtraMainLifts();queueWorkoutAutosave()}
function removeExtraMainSet(id,index){syncExtraMainInputs();const ex=extraMainLifts.find(x=>String(x.id)===String(id));if(!ex)return;ex.sets.splice(index,1);if(!ex.sets.length)ex.sets.push({weight:'',reps:''});renderExtraMainLifts();queueWorkoutAutosave()}
function syncExtraMainInputs(){extraMainLifts.forEach(ex=>ex.sets.forEach((set,i)=>{const w=document.getElementById(`mainw-${ex.id}-${i}`),r=document.getElementById(`mainr-${ex.id}-${i}`);if(w)set.weight=w.value;if(r)set.reps=r.value}))}
function lastMainLogForLift(lift){for(const h of [...(state.history||[])].reverse()){const logs=(h.mainLogs||[]).filter(x=>x.lift===lift&&Number(x.weight)>0&&Number(x.reps)>0);if(logs.length)return logs[logs.length-1]}return null}
function renderExtraMainLifts(){const host=document.getElementById('extraMainLifts');if(!host)return;if(!extraMainLifts.length){host.innerHTML='<div class="empty-extra">No off-plan lifts added yet.</div>';return}host.innerHTML=extraMainLifts.map(ex=>{const last=lastMainLogForLift(ex.lift);return `<div class="listitem extra-exercise"><div class="row"><div><b>${esc(LIFTS[ex.lift])}</b>${last?`<div class="muted small">Last time: ${fmt(Number(last.weight))}kg × ${last.reps}</div>`:'<div class="muted small">No previous performance logged.</div>'}<div class="prline">Current 1RM: ${fmt(state.oneRMs[ex.lift]||0)}kg</div></div><div><button class="remove-link" onclick="removeExtraMainLift('${ex.id}')">Remove</button></div></div>${ex.sets.map((set,i)=>`<div class="set extra-set" id="set-xm${ex.id}-${i}"><div><b>Set ${i+1}</b><div class="muted small">Weight × reps</div></div><div><input class="assist-input" id="mainw-${ex.id}-${i}" inputmode="decimal" placeholder="kg" value="${esc(set.weight)}"><div class="quick-weight"><button type="button" onclick="nudgeWeight('mainw-${ex.id}-${i}',-${state.settings.roundTo||2.5})">−</button><button type="button" onclick="copyWeightDown('mainw-${ex.id}-${i}')">↧</button><button type="button" onclick="nudgeWeight('mainw-${ex.id}-${i}',${state.settings.roundTo||2.5})">+</button></div></div><input class="assist-input rep-tap" id="mainr-${ex.id}-${i}" inputmode="none" placeholder="reps" value="${esc(set.reps)}" readonly><button class="check" onclick="toggleSet('xm${ex.id}-${i}',180)">✓</button>${ex.sets.length>1?`<button class="remove-link" style="grid-column:1/-1;justify-self:end" onclick="removeExtraMainSet('${ex.id}',${i})">Remove set</button>`:''}</div>`).join('')}<button class="btn ghost mini" onclick="addExtraMainSet('${ex.id}')">+ Add Set</button></div>`}).join('')}
function collectExtraMainLogs(){syncExtraMainInputs();let logs=[];extraMainLifts.forEach(ex=>ex.sets.forEach((set,i)=>{if(String(set.reps||'').trim()||String(set.weight||'').trim())logs.push({id:`mainx-${ex.id}-${i}`,lift:ex.lift,set:i+1,weight:set.weight,reps:set.reps})}));return logs}
function collectExtraMainPRs(logs){let prs=[];logs.forEach(x=>{const weight=Number(x.weight),reps=Number(x.reps);if(!weight||!reps)return;const est=epley(weight,reps);if(est>(state.oneRMs[x.lift]||0))prs.push({lift:x.lift,weight,reps,est})});return prs}

window.toggleSet=(id,rest=120)=>{const el=document.getElementById('set-'+id);el?.classList.toggle('done');queueWorkoutAutosave();if(el?.classList.contains('done')){startRest(rest);scrollNext(el)}}
function finishWorkout(){
 const w=current(),finishedAt=new Date();
 const notes=document.getElementById('sessionNote')?.value||'';
 const rating=Number(selectedSessionRating||workoutDraft?.rating||0);
 const programmedMainLogs=[...document.querySelectorAll('[id^="reps-"]')].map(x=>({id:x.id,reps:x.value,weight:x.dataset.prWeight||'',lift:x.dataset.prLift||''}));
 let accLogs=[];document.querySelectorAll('[id^="accr-"]').forEach(r=>{const parts=r.id.split('-');const id=`${parts[1]}-${parts[2]}`;const wt=document.getElementById(`accw-${id}`);accLogs.push({id:r.id,name:r.dataset.accName||'',set:r.dataset.accSet||'',weight:wt?.value||'',reps:r.value||''})});
 const extraLogs=collectExtraLogs(), extraMainLogs=collectExtraMainLogs(), mainLogs=[...programmedMainLogs,...extraMainLogs];
 const potential=[...collectPotentialPRs(),...collectExtraMainPRs(extraMainLogs)], accepted=handlePRs(potential);
 const volume=sessionVolume(mainLogs,accLogs,extraLogs);
 const completedSets=document.querySelectorAll('#workout .set.done').length;
 const exerciseCount=w.items.length+new Set(extraLogs.map(x=>x.name)).size+extraMainLifts.length;
 const started=new Date(workoutDraft?.startedAt||finishedAt);const durationMinutes=Math.max(1,Math.round(workoutElapsedMs(finishedAt.getTime())/60000));
 const isCustom=!!workoutDraft?.custom; const savedWorkout={date:finishedAt.toISOString(),startedAt:started.toISOString(),finishedAt:finishedAt.toISOString(),position:state.position,title:w.title,phase:isCustom?'Additional session':w.phase,block:isCustom?'—':w.block,custom:isCustom,quickType:workoutDraft?.quickType||'',rating,notes,mainLogs,accLogs,extraLogs,prs:accepted,volume,durationMinutes,completedSets,exerciseCount};
 state.history.push(savedWorkout);extraExercises=[];extraMainLifts=[];selectedSessionRating=0;clearWorkoutDraft();if(!isCustom)state.position=Math.min(state.position+1,activeProgrammeLength()-1);save();releaseWakeLock();nav('home');showWorkoutSummary(savedWorkout)
}
function showWorkoutSummary(h){document.getElementById('workoutSummary')?.remove();const modal=document.createElement('div');modal.id='workoutSummary';modal.className='summary-overlay';modal.innerHTML=`<div class="summary-panel"><div class="row"><div><div class="muted small">SESSION COMPLETE</div><div class="title">${esc(h.title)}</div></div><span class="tag">Saved</span></div><div class="summary-grid"><div class="metric"><b>${fmt(h.volume||0)}kg</b><span>Total volume</span></div><div class="metric"><b>${h.completedSets||0}</b><span>Sets completed</span></div><div class="metric"><b>${h.exerciseCount||0}</b><span>Exercises</span></div><div class="metric"><b>${h.durationMinutes||0} min</b><span>Session time</span></div></div>${h.rating?`<div class="rating-summary"><b>Session rating</b><div class="rating-display">${starText(h.rating)} <span class="muted small">${h.rating}/5</span></div></div>`:''}${(h.prs||[]).length?`<div class="summary-pr">🏆 ${(h.prs||[]).length} new estimated PR${h.prs.length===1?'':'s'} recorded.</div>`:''}${h.notes?`<div class="listitem"><b>Coach note</b><div class="muted small">${esc(h.notes)}</div></div>`:''}<button class="btn green" onclick="closeWorkoutSummary()">DONE</button></div>`;document.body.appendChild(modal)}
function closeWorkoutSummary(){document.getElementById('workoutSummary')?.remove();nav('home')}

function sessionVolume(mainLogs=[],accLogs=[],extraLogs=[]){let v=0;mainLogs.forEach(x=>{v+=Number(x.weight||0)*Number(x.reps||0)});accLogs.forEach(x=>{v+=Number(x.weight||0)*Number(x.reps||0)});extraLogs.forEach(x=>{if(!x.bodyweight)v+=Number(x.weight||0)*Number(x.reps||0)});return Math.round(v)}
function skipForward(){if(confirm('Skip this workout and move to the next?')){clearWorkoutDraft();extraExercises=[];state.position=Math.min(state.position+1,activeProgrammeLength()-1);save();releaseWakeLock();toast('Moved forward');render()}}
let programmeOpenIndex=-1;
let programmePhaseOpen={};
function isPhaseOpen(pi){if(Object.prototype.hasOwnProperty.call(programmePhaseOpen,pi))return programmePhaseOpen[pi];const cur=PROGRAMME[Math.min(state.position,PROGRAMME.length-1)];return pi===cur.phaseIndex}
function togglePhase(pi){programmePhaseOpen[pi]=!isPhaseOpen(pi);renderProgramme()}
function programmeItemName(it){return it.kind==='accessory'?(it.name||'Accessory'):(it.label||LIFTS[it.lift]||'Main lift')}
function programmeItemTarget(it){if(it.kind==='main')return mainSummary(it);if(it.kind==='benchMirror')return `${it.sets||0} × ${it.reps||''} • by feel`;return `${it.sets||0} sets • ${it.amrap?'AMRAP':(it.reps||'reps')}${it.totalReps?` • ${it.totalReps} total`:''}`}
function programmeDetailHtml(idx){const w=programmeWorkout(idx);return `<div class="programme-detail-list">${w.items.map((it,i)=>`<div class="programme-exercise-row"><span class="tag">${i+1}</span><div><b>${esc(programmeItemName(it))}</b><div class="muted small">${esc(programmeItemTarget(it))}</div>${it.note?`<div class="muted small">${esc(it.note)}</div>`:''}</div><span class="tag">${it.kind==='accessory'?(it.role||'assistance'):(it.type||'main')}</span></div>`).join('')}<div class="two-buttons"><button class="btn secondary mini" onclick="event.stopPropagation();openProgrammeEditor(${idx})">Edit workout</button><button class="btn ghost mini" onclick="event.stopPropagation();jumpTo(${idx})">Make current</button></div>${state.programmeOverrides?.[String(idx)]?`<button class="btn danger mini" onclick="event.stopPropagation();restoreProgrammeWorkout(${idx})">Restore Campbell original</button>`:''}</div>`}

let programmeLibraryMode='library', customProgrammeOpen='';
function programmeLibraryCards(){const custom=state.customProgrammes||[];const all=[{id:'campbell',name:'Campbell PRS',desc:'Original 36-workout programme',daysPerWeek:3,workouts:PROGRAMME,builtin:true},...custom];return all.map(p=>{const active=(state.activeProgrammeId||'campbell')===p.id;return `<div class="programme-tile ${active?'active-programme':''}"><div class="row"><div><b>${esc(p.name)}</b><div class="muted small">${esc(p.desc||'Custom programme')}</div></div><span class="tag">${active?'ACTIVE':`${p.workouts?.length||0} workouts`}</span></div><div class="programme-tile-stats"><span>${p.daysPerWeek||3} days/week</span><span>${p.workouts?.length||0} sessions</span></div><div class="two-buttons"><button class="btn secondary mini" onclick="previewProgramme('${p.id}')">Preview</button>${active?'':`<button class="btn mini" onclick="activateProgramme('${p.id}')">Use programme</button>`}</div>${p.id!=='campbell'?`<button class="linklike small" onclick="editCustomProgramme('${p.id}')">Edit programme</button> <button class="linklike small" onclick="deleteCustomProgramme('${p.id}')">Delete</button>`:''}</div>`}).join('')}
function availableProgrammeHtml(){return PROGRAMME_TEMPLATES.map(t=>`<div class="programme-tile"><div class="row"><div><b>${esc(t.name)}</b><div class="muted small">${esc(t.desc)}</div></div><span class="tag">${t.workouts.length} workouts</span></div><div class="programme-tile-stats"><span>${t.daysPerWeek} days/week</span><span>Editable copy</span></div><button class="btn secondary" onclick="addTemplateProgramme('${t.id}')">Add to My Programmes</button></div>`).join('')}
function addTemplateProgramme(id){const t=PROGRAMME_TEMPLATES.find(x=>x.id===id);if(!t)return;const copy={id:`custom-${Date.now()}`,name:t.name,desc:t.desc,daysPerWeek:t.daysPerWeek,workouts:JSON.parse(JSON.stringify(t.workouts))};state.customProgrammes=[...(state.customProgrammes||[]),copy];save();renderProgramme();toast('Programme added')}
function activateProgramme(id){if(!confirm('Switch active programme? Your workout history stays intact and this programme starts at workout 1.'))return;state.activeProgrammeId=id;state.position=0;clearWorkoutDraft();save();render();toast(`${activeProgrammeName()} is now active`)}
function deleteCustomProgramme(id){if(!confirm('Delete this saved programme?'))return;state.customProgrammes=(state.customProgrammes||[]).filter(p=>p.id!==id);if(state.activeProgrammeId===id){state.activeProgrammeId='campbell';state.position=0}save();renderProgramme()}
function previewProgramme(id){customProgrammeOpen=customProgrammeOpen===id?'':id;renderProgramme()}
function programmePreviewHtml(){if(!customProgrammeOpen)return '';const p=customProgrammeOpen==='campbell'?{id:'campbell',name:'Campbell PRS',workouts:PROGRAMME.map((_,i)=>programmeWorkout(i))}:(state.customProgrammes||[]).find(x=>x.id===customProgrammeOpen);if(!p)return '';return `<div class="card"><div class="row"><div><div class="h2">${esc(p.name)}</div><div class="muted small">Programme preview</div></div><button class="btn secondary mini" onclick="customProgrammeOpen='';renderProgramme()">Close</button></div>${(p.workouts||[]).map((w,i)=>`<div class="listitem"><b>${i+1}. ${esc(w.title)}</b><div class="muted small">${(w.items||[]).map(x=>esc(x.label||x.name||'Exercise')).join(' • ')}</div></div>`).join('')}</div>`}
async function createCustomProgramme(){const name=await askText('Programme name');if(!name)return;const daysInput=await askText('Training days per week','3');if(daysInput===null)return;const days=Math.max(1,Math.min(7,Number(daysInput)||3));const workouts=[];for(let i=0;i<days;i++)workouts.push({title:`Day ${i+1}`,items:[acc('Add exercise','8 to 12','',{sets:3})]});const p={id:`custom-${Date.now()}`,name,desc:'Custom StrengthOS programme',daysPerWeek:days,workouts};state.customProgrammes=[...(state.customProgrammes||[]),p];save();editCustomProgramme(p.id)}
function editCustomProgramme(id){const p=(state.customProgrammes||[]).find(x=>x.id===id);if(!p)return;const html=`<div class="backup-overlay" id="customProgrammeEditor"><div class="backup-panel programme-builder"><div class="row"><div><div class="h2">Edit ${esc(p.name)}</div><div class="muted small">One exercise per line: Name | sets | reps</div></div><button class="btn secondary mini" onclick="document.getElementById('customProgrammeEditor').remove()">Close</button></div><label class="small muted">Programme name</label><input class="input" id="cp-name" value="${esc(p.name)}">${p.workouts.map((w,i)=>`<div class="listitem"><label class="small muted">Workout ${i+1}</label><input class="input" id="cp-title-${i}" value="${esc(w.title)}"><textarea class="input note" id="cp-items-${i}">${(w.items||[]).map(x=>`${x.name||x.label||'Exercise'} | ${x.sets||3} | ${x.reps||'8 to 12'}`).join('\n')}</textarea></div>`).join('')}<button class="btn secondary" onclick="addCustomWorkoutEditor('${id}')">Add workout</button><button class="btn" onclick="saveCustomProgramme('${id}')">Save programme</button></div></div>`;document.body.insertAdjacentHTML('beforeend',html)}
function addCustomWorkoutEditor(id){const p=(state.customProgrammes||[]).find(x=>x.id===id);if(!p)return;p.workouts.push({title:`Day ${p.workouts.length+1}`,items:[acc('Add exercise','8 to 12','',{sets:3})]});save();document.getElementById('customProgrammeEditor')?.remove();editCustomProgramme(id)}
function saveCustomProgramme(id){const p=(state.customProgrammes||[]).find(x=>x.id===id);if(!p)return;p.name=document.getElementById('cp-name')?.value.trim()||p.name;p.workouts=p.workouts.map((w,i)=>{const lines=(document.getElementById(`cp-items-${i}`)?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);return {title:document.getElementById(`cp-title-${i}`)?.value.trim()||w.title,items:lines.map(line=>{const [name,sets,reps]=line.split('|').map(x=>x.trim());return acc(name||'Exercise',reps||'8 to 12','',{sets:Number(sets)||3})})}});save();document.getElementById('customProgrammeEditor')?.remove();render();toast('Custom programme saved')}
function programmesHubHtml(){return `<div class="card hero"><div class="muted small">MANAGE PROGRAMMES</div><div class="title">${esc(activeProgrammeName())}</div><div class="muted">Choose a routine, preview what is coming or build your own.</div><div class="programme-summary"><div class="metric"><b>${activeProgrammeLength()}</b><span>Sessions in active plan</span></div><div class="metric"><b>${(state.customProgrammes||[]).length}</b><span>Saved programmes</span></div></div></div><div class="programme-tabs"><button class="btn ${programmeLibraryMode==='library'?'':'secondary'} mini" onclick="programmeLibraryMode='library';renderProgramme()">My Programmes</button><button class="btn ${programmeLibraryMode==='discover'?'':'secondary'} mini" onclick="programmeLibraryMode='discover';renderProgramme()">Discover</button></div>${programmeLibraryMode==='library'?`<div class="programme-grid">${programmeLibraryCards()}</div><button class="btn secondary" onclick="createCustomProgramme()">+ Create Programme</button>`:`<div class="programme-grid">${availableProgrammeHtml()}</div>`}${programmePreviewHtml()}`}

function renderProgramme(){const cur=programmeWorkout(Math.min(state.position,PROGRAMME.length-1)),next=programmeWorkout(Math.min(state.position+1,PROGRAMME.length-1));const editedCount=Object.keys(state.programmeOverrides||{}).length;const isCampbell=(state.activeProgrammeId||'campbell')==='campbell';document.getElementById('programme').classList.add('programme-widget-page');document.getElementById('programme').innerHTML=(isCampbell?`<div class="card hero"><div class="muted small">COMING UP</div><div class="title">${esc(cur.title)}</div><div class="muted">${cur.phase} • Block ${cur.block} • Workout ${state.position+1}/${activeProgrammeLength()}</div><div class="programme-summary"><div class="metric"><b>${activeProgrammeLength()-state.position}</b><span>Sessions remaining</span></div><div class="metric"><b>${editedCount}</b><span>Personalised workouts</span></div></div></div><div class="card">${state.position<PROGRAMME.length-1?`<div class="listitem"><b>Next: ${esc(next.title)}</b><div class="muted small">${next.phase} • Block ${next.block}</div></div>`:'<div class="muted">Cycle complete.</div>'}</div>`:`<div class="card hero"><div class="muted small">COMING UP</div><div class="title">${esc(activeProgrammeName())}</div><div class="muted">Custom programme active. Open Manage Programmes below to preview or switch.</div></div>`)+(isCampbell?PHASES.map((p,pi)=>{const open=isPhaseOpen(pi);return `<div class="card"><div class="row" style="cursor:pointer" onclick="togglePhase(${pi})"><div><div class="h2">${p.name}</div><div class="muted small">${p.desc}</div></div><span class="tag">${open?'▲ Hide':'▼ Show'}</span></div>${open?p.blocks.map(b=>`<div class="section-title">Block ${b.block}</div>${b.days.map((d,di)=>{const idx=PROGRAMME.findIndex(x=>x.phaseIndex===pi&&x.block===b.block&&x.dayIndex===di),w=programmeWorkout(idx),wOpen=programmeOpenIndex===idx,edited=!!state.programmeOverrides?.[String(idx)];return `<div class="listitem programme-workout-card ${idx===state.position?'current':''} ${edited?'edited':''}" onclick="event.stopPropagation();programmeOpenIndex=${wOpen?-1:idx};renderProgramme()"><div class="row"><div><b>${esc(w.title)}</b><div class="muted small">Workout ${idx+1} • ${w.items.length} exercises${edited?' • Personalised':''}</div></div><span class="tag">${wOpen?'▲':'▼'}</span></div>${wOpen?programmeDetailHtml(idx):''}</div>`}).join('')}`).join(''):''}</div>`}).join('')+programmeChangeLogHtml():'')+programmesHubHtml()}
function programmeChangeLogHtml(){const log=(state.programmeChangeLog||[]).slice(-10).reverse();return `<div class="card"><div class="h2">Recent programme changes</div>${log.length?log.map(x=>`<div class="listitem programme-change"><b>${esc(x.workoutTitle)}</b><div class="muted small">${new Date(x.date).toLocaleString()} • ${esc(x.detail)}</div></div>`).join(''):'<div class="muted">No programme edits yet.</div>'}</div>`}
function editorItemHtml(it,i,total){const name=programmeItemName(it),sets=Number(it.sets||1),reps=it.reps||'';return `<div class="programme-edit-item" data-editor-item="${i}"><div class="row"><b>Exercise ${i+1}</b><span class="tag">${it.kind}</span></div><div class="programme-edit-grid"><input class="input" id="pe-name-${i}" value="${esc(name)}" placeholder="Exercise"><input class="input" id="pe-sets-${i}" type="number" min="1" value="${sets}" placeholder="sets"><input class="input" id="pe-reps-${i}" value="${esc(String(reps))}" placeholder="reps"></div><input class="input" id="pe-note-${i}" value="${esc(it.note||'')}" placeholder="Exercise note (optional)"><div class="programme-edit-actions"><button class="btn ghost mini" onclick="moveProgrammeEditorItem(${i},-1)" ${i===0?'disabled':''}>↑ Up</button><button class="btn ghost mini" onclick="moveProgrammeEditorItem(${i},1)" ${i===total-1?'disabled':''}>↓ Down</button><button class="btn danger mini" onclick="removeProgrammeEditorItem(${i})">Remove</button></div></div>`}
let programmeEditorIndex=-1,programmeEditorItems=[];
function openProgrammeEditor(idx){programmeEditorIndex=idx;const w=programmeWorkout(idx);programmeEditorItems=JSON.parse(JSON.stringify(w.items));drawProgrammeEditor()}
function syncProgrammeEditorInputs(){programmeEditorItems.forEach((it,i)=>{const n=document.getElementById(`pe-name-${i}`),sets=document.getElementById(`pe-sets-${i}`),reps=document.getElementById(`pe-reps-${i}`),note=document.getElementById(`pe-note-${i}`);if(n){if(it.kind==='accessory')it.name=n.value.trim()||it.name;else it.label=n.value.trim()||it.label;it.sets=Math.max(1,Number(sets.value)||1);it.reps=String(reps.value||'');it.note=note.value||''}})}
function drawProgrammeEditor(){document.getElementById('programmeEditor')?.remove();const w=programmeWorkout(programmeEditorIndex),m=document.createElement('div');m.id='programmeEditor';m.className='programme-editor-overlay';m.innerHTML=`<div class="programme-editor-panel"><div class="row"><div><div class="muted small">EDIT WORKOUT ${programmeEditorIndex+1}</div><div class="title">${esc(w.title)}</div></div><button class="btn ghost mini" onclick="closeProgrammeEditor()">Close</button></div><label class="small muted">Workout name</label><input class="input" id="pe-title" value="${esc(w.title)}">${programmeEditorItems.map((it,i)=>editorItemHtml(it,i,programmeEditorItems.length)).join('')}<button class="btn secondary" onclick="addProgrammeEditorExercise()">+ Add exercise</button><div class="two-buttons"><button class="btn green" onclick="saveProgrammeEditor()">Save changes</button><button class="btn danger" onclick="restoreProgrammeWorkout(${programmeEditorIndex},true)">Restore original</button></div></div>`;document.body.appendChild(m)}
function closeProgrammeEditor(){document.getElementById('programmeEditor')?.remove();programmeEditorIndex=-1;programmeEditorItems=[]}
function moveProgrammeEditorItem(i,d){syncProgrammeEditorInputs();const j=i+d;if(j<0||j>=programmeEditorItems.length)return;[programmeEditorItems[i],programmeEditorItems[j]]=[programmeEditorItems[j],programmeEditorItems[i]];drawProgrammeEditor()}
function removeProgrammeEditorItem(i){syncProgrammeEditorInputs();if(programmeEditorItems.length<=1)return toast('A workout needs at least one exercise');if(!confirm('Remove this exercise from the workout?'))return;programmeEditorItems.splice(i,1);drawProgrammeEditor()}
function addProgrammeEditorExercise(){syncProgrammeEditorInputs();programmeEditorItems.push({kind:'accessory',name:'New Exercise',reps:'8 to 12',sets:3,totalReps:'',role:'assistance',amrap:false,note:''});drawProgrammeEditor()}
function saveProgrammeEditor(){syncProgrammeEditorInputs();const base=PROGRAMME[programmeEditorIndex],title=document.getElementById('pe-title')?.value.trim()||base.title;state.programmeOverrides=state.programmeOverrides||{};state.programmeOverrides[String(programmeEditorIndex)]={title,items:JSON.parse(JSON.stringify(programmeEditorItems))};state.programmeChangeLog=[...(state.programmeChangeLog||[]),{date:new Date().toISOString(),workoutIndex:programmeEditorIndex,workoutTitle:title,detail:'Workout personalised'}].slice(-100);save();closeProgrammeEditor();render();toast('Programme workout saved')}
function restoreProgrammeWorkout(idx,fromEditor=false){if(!state.programmeOverrides?.[String(idx)]){if(fromEditor)closeProgrammeEditor();return}if(!confirm('Restore this workout to the original Campbell version?'))return;const title=programmeWorkout(idx).title;delete state.programmeOverrides[String(idx)];state.programmeChangeLog=[...(state.programmeChangeLog||[]),{date:new Date().toISOString(),workoutIndex:idx,workoutTitle:PROGRAMME[idx].title,detail:'Restored Campbell original'}].slice(-100);save();if(fromEditor)closeProgrammeEditor();render();toast('Original workout restored')}
function jumpTo(idx){if(confirm(`Jump to workout #${idx+1}?`)){clearWorkoutDraft();extraExercises=[];state.position=idx;save();nav('home');toast('Workout selected')}}

function allExerciseHistory(){
  const map={};
  (state.history||[]).forEach(h=>{
    [...(h.accLogs||[]),...(h.extraLogs||[])].forEach(x=>{
      const name=String(x.name||'').trim(); if(!name||!Number(x.reps))return;
      if(!map[name])map[name]=[];
      map[name].push({...x,date:h.date,title:h.title,sessionVolume:h.volume||0});
    });
  });
  return map;
}
function exerciseLibraryRows(){
  const hist=allExerciseHistory();
  const programmeNames=PROGRAMME.flatMap(w=>w.items.filter(i=>i.kind==='accessory').map(i=>i.name));
  const names=[...new Set([...(typeof EXERCISE_LIBRARY!=='undefined'?EXERCISE_LIBRARY:[]),...programmeNames,...Object.keys(hist)])].sort((a,b)=>a.localeCompare(b));
  return names.map(name=>{
    const logs=hist[name]||[];
    const weighted=logs.filter(x=>Number(x.weight)>0);
    const best=weighted.length?weighted.reduce((a,b)=>(epley(b.weight,b.reps)>epley(a.weight,a.reps)?b:a)):logs.reduce((a,b)=>(Number(b.reps)>Number(a?.reps||0)?b:a),null);
    const last=logs.length?logs[logs.length-1]:null;
    return {name,logs,best,last,totalSets:logs.length,totalVolume:Math.round(logs.reduce((n,x)=>n+Number(x.weight||0)*Number(x.reps||0),0))};
  });
}

function repPRsFor(name){
 const logs=(allExerciseHistory()[name]||[]).filter(x=>Number(x.reps)>0);
 const reps=[1,3,5,8];const out={};
 reps.forEach(target=>{const exact=logs.filter(x=>Number(x.reps)===target&&Number(x.weight)>0);out[target]=exact.length?exact.reduce((a,b)=>Number(b.weight)>Number(a.weight)?b:a):null});
 return out;
}

function buildCoachObservations(){const obs=[],cmp=weeklyComparison(),hist=state.history||[],total=powerTotal(),goal=state.settings.goalTotal||500;
  const trends=Object.keys(LIFTS).map(l=>({lift:l,rows:liftRows(l),trend:liftTrend(l)})).sort((a,b)=>b.trend.delta-a.trend.delta);
  const best=trends.find(x=>x.trend.delta>1);if(best){const rows=best.rows.slice(-6);obs.push({type:'positive',icon:'🟢',title:`${LIFTS[best.lift]} is moving well`,text:`Estimated strength is ${best.trend.text} across the recent comparison window.`,confidence:confidenceFor(rows.length),why:`Recent ${LIFTS[best.lift]} working sets produced a higher estimated 1RM than the preceding sets.`,evidence:rows.slice(-4).map(x=>`${new Date(x.date).toLocaleDateString()}: ${fmt(x.weight)}kg × ${x.reps} (est. ${fmt(x.est)}kg)`)})}
