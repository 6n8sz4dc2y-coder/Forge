<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070708" />
<link rel="manifest" href="manifest.json" />
<title>Forge PRS</title>
<style>
:root{--bg:#070708;--card:#141418;--card2:#1d1e25;--text:#f6f6f8;--muted:#a2a2ad;--line:#2a2b33;--red:#ff3b30;--green:#30d158;--amber:#ffd60a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#181820 0,#070708 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:16px;padding:14px 16px;background:var(--red);color:white;font-weight:800}button.secondary{background:var(--card2);color:var(--text)}button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}input,textarea,select{width:100%;background:#0d0d11;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px}textarea{min-height:86px}.wrap{max-width:820px;margin:0 auto;padding:18px 14px 96px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}.brand{font-size:32px;font-weight:950;letter-spacing:-1.2px}.pill{padding:8px 12px;border-radius:999px;background:#241210;color:#ff7b72;font-size:13px;font-weight:800}.card{background:rgba(20,20,24,.92);border:1px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 18px 40px rgba(0,0,0,.18)}.hero{padding:24px}.muted{color:var(--muted)}.small{font-size:13px}.big{font-size:44px;font-weight:950;letter-spacing:-1px}.title{font-size:27px;font-weight:920;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{font-size:28px;display:block}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.set{display:grid;grid-template-columns:1fr 82px 70px 52px;gap:8px;align-items:center;margin:8px 0}.set input{text-align:center;padding:11px}.check{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px}.done{background:var(--green)!important;color:#04190a!important}.tag{font-size:12px;background:#24242c;padding:5px 9px;border-radius:999px;color:#c8c8d0}.bar{height:12px;background:#26262d;border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--red)}.phasegrid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}.box{height:25px;border-radius:7px;background:#282831}.box.on{background:var(--red)}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,12,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.navinner{max-width:820px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:9px 10px calc(12px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:var(--muted);font-size:12px;padding:10px 3px}.nav button.active{color:var(--red)}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ok{color:var(--green)}.warn{color:var(--amber)}.danger{color:#ff7b72}.hidden{display:none}@media(min-width:680px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav"><div class="navinner">
<button id="tabHome" onclick="go('home')">Today</button>
<button id="tabLog" onclick="go('log')">Workout</button>
<button id="tabHistory" onclick="go('history')">History</button>
<button id="tabProgress" onclick="go('progress')">Progress</button>
<button id="tabSettings" onclick="go('settings')">Setup</button>
</div></div>
<script src="app.js"></script>
</body>
</html>
