function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function exerciseFavourites(){return Array.isArray(state.settings.exerciseFavourites)?state.settings.exerciseFavourites:[]}
function isFavouriteExercise(name){return exerciseFavourites().some(x=>x.toLowerCase()===String(name).toLowerCase())}
function toggleExerciseFavourite(name){const clean=String(name||'').trim();if(!clean)return;let fav=[...exerciseFavourites()];const i=fav.findIndex(x=>x.toLowerCase()===clean.toLowerCase());if(i>=0)fav.splice(i,1);else fav.unshift(clean);state.settings.exerciseFavourites=fav.slice(0,20);save();renderWorkout();toast(i>=0?'Removed from favourites':'Added to favourites')}
function favouritePickerHtml(){const fav=exerciseFavourites();return fav.length?`<div class="muted small">Favourites</div><div class="favorite-chips">${fav.map(x=>`<button class="favorite-chip" onclick="addExtraExerciseByName('${esc(x).replace(/&#39;/g,"\'")}')">★ ${esc(x)}</button>`).join('')}</div>`:''}
function addExtraExerciseByName(name){const clean=String(name||'').trim();if(!clean)return;extraExercises.push({id:Date.now()+Math.random(),name:clean,bodyweight:false,sets:[{weight:previousWeightFor(clean,0),reps:''}]});hideExercisePicker();renderExtraExercises();queueWorkoutAutosave()}
function showExercisePicker(){document.getElementById('exercisePicker')?.classList.remove('hidden');setTimeout(()=>document.getElementById('exerciseSearch')?.focus(),50)}
function hideExercisePicker(){document.getElementById('exercisePicker')?.classList.add('hidden')}
function addExtraExercise(){const input=document.getElementById('exerciseSearch');const name=(input?.value||'').trim();if(!name){toast('Enter an exercise name');return}if(input)input.value='';addExtraExerciseByName(name)}
function removeExtraExercise(id){extraExercises=extraExercises.filter(x=>String(x.id)!==String(id));renderExtraExercises();queueWorkoutAutosave()}
function addExtraSet(id){const ex=extraExercises.find(x=>String(x.id)===String(id));if(!ex)return;syncExtraInputs();ex.sets.push({weight:'',reps:''});renderExtraExercises();queueWorkoutAutosave()}
function removeExtraSet(id,index){syncExtraInputs();const ex=extraExercises.find(x=>String(x.id)===String(id));if(!ex)return;ex.sets.splice(index,1);if(!ex.sets.length)ex.sets.push({weight:'',reps:''});renderExtraExercises();queueWorkoutAutosave()}
function toggleExtraBodyweight(id,checked){syncExtraInputs();const ex=extraExercises.find(x=>String(x.id)===String(id));if(!ex)return;ex.bodyweight=!!checked;renderExtraExercises();queueWorkoutAutosave()}
function syncExtraInputs(){extraExercises.forEach(ex=>ex.sets.forEach((set,i)=>{const w=document.getElementById(`extraw-${ex.id}-${i}`),r=document.getElementById(`extrar-${ex.id}-${i}`);if(w)set.weight=w.value;if(r)set.reps=r.value}))}
function lastExtraLog(name){for(const h of [...(state.history||[])].reverse()){const logs=(h.extraLogs||[]).filter(x=>x.name===name&&x.reps);if(logs.length)return logs.map(x=>`${x.bodyweight?'BW':fmt(Number(x.weight||0))+'kg'}×${x.reps}`).join(' / ')}return ''}
function coachExtraTarget(name){const prev=lastLogsForExercise(name);if(!prev)return 'Set a baseline today.';const best=prev.logs.reduce((a,x)=>Number(x.reps||0)>Number(a.reps||0)?x:a,prev.logs[0]);if(best.bodyweight)return `Beat ${best.reps} reps`;return `Beat ${fmt(Number(best.weight||0))}kg × ${best.reps}, or add a rep across the sets` }
function renderExtraExercises(){const host=document.getElementById('extraExercises');if(!host)return;if(!extraExercises.length){host.innerHTML='<div class="empty-extra">No extra exercises added yet.</div>';return}host.innerHTML=extraExercises.map(ex=>{const last=lastExtraLog(ex.name);return `<div class="listitem extra-exercise"><div class="row"><div><b>${esc(ex.name)}</b>${last?`<div class="muted small">Last time: ${esc(last)}</div><div class="prline"><span class="coach-badge">Coach</span> ${esc(coachExtraTarget(ex.name))}</div><button class="btn ghost load-last" onclick="loadPreviousExtra('${ex.id}','${esc(ex.name).replace(/&#39;/g,"\'")}')">Use last sets</button>`:'<div class="muted small">No previous performance logged.</div>'}</div><div><button class="star-btn" aria-label="Favourite exercise" onclick="toggleExerciseFavourite('${esc(ex.name).replace(/&#39;/g,"\'")}')">${isFavouriteExercise(ex.name)?'★':'☆'}</button><button class="remove-link" onclick="removeExtraExercise('${ex.id}')">Remove</button></div></div><label class="bodyweight-row"><input type="checkbox" ${ex.bodyweight?'checked':''} onchange="toggleExtraBodyweight('${ex.id}',this.checked)">Bodyweight exercise</label>${ex.sets.map((set,i)=>`<div class="set extra-set" id="set-x${ex.id}-${i}"><div><b>Set ${i+1}</b><div class="muted small">${ex.bodyweight?'Bodyweight':'Weight × reps'}</div></div><div><input class="assist-input" id="extraw-${ex.id}-${i}" inputmode="decimal" placeholder="${ex.bodyweight?'BW':'kg'}" value="${ex.bodyweight?'':esc(set.weight)}" ${ex.bodyweight?'disabled':''}><div class="quick-weight ${ex.bodyweight?'hidden':''}"><button type="button" onclick="nudgeWeight('extraw-${ex.id}-${i}',-${state.settings.roundTo||2.5})">−</button><button type="button" onclick="copyWeightDown('extraw-${ex.id}-${i}')">↧</button><button type="button" onclick="nudgeWeight('extraw-${ex.id}-${i}',${state.settings.roundTo||2.5})">+</button></div></div><input class="assist-input rep-tap" id="extrar-${ex.id}-${i}" inputmode="none" placeholder="reps" value="${esc(set.reps)}" readonly><button class="check" onclick="toggleSet('x${ex.id}-${i}',90)">✓</button>${ex.sets.length>1?`<button class="remove-link" style="grid-column:1/-1;justify-self:end" onclick="removeExtraSet('${ex.id}',${i})">Remove set</button>`:''}</div>`).join('')}<button class="btn ghost mini" onclick="addExtraSet('${ex.id}')">+ Add Set</button></div>`}).join('')}
function collectExtraLogs(){syncExtraInputs();let logs=[];extraExercises.forEach(ex=>ex.sets.forEach((set,i)=>{if(String(set.reps||'').trim()||String(set.weight||'').trim())logs.push({id:`extra-${ex.id}-${i}`,name:ex.name,set:i+1,bodyweight:!!ex.bodyweight,weight:ex.bodyweight?'':set.weight,reps:set.reps})}));return logs}

window.toggleSet=(id,rest=120)=>{const el=document.getElementById('set-'+id);el?.classList.toggle('done');queueWorkoutAutosave();if(el?.classList.contains('done')){startRest(rest);scrollNext(el)}}
function finishWorkout(){
 const w=current(),finishedAt=new Date();
 const notes=document.getElementById('sessionNote')?.value||'';
 const mainLogs=[...document.querySelectorAll('[id^="reps-"]')].map(x=>({id:x.id,reps:x.value,weight:x.dataset.prWeight||'',lift:x.dataset.prLift||''}));
 let accLogs=[];document.querySelectorAll('[id^="accr-"]').forEach(r=>{const parts=r.id.split('-');const id=`${parts[1]}-${parts[2]}`;const wt=document.getElementById(`accw-${id}`);accLogs.push({id:r.id,name:r.dataset.accName||'',set:r.dataset.accSet||'',weight:wt?.value||'',reps:r.value||''})});
 const extraLogs=collectExtraLogs(), potential=collectPotentialPRs(), accepted=handlePRs(potential);
 const volume=sessionVolume(mainLogs,accLogs,extraLogs);
 const completedSets=document.querySelectorAll('#workout .set.done').length;
 const exerciseCount=w.items.length+new Set(extraLogs.map(x=>x.name)).size;
 const started=new Date(workoutDraft?.startedAt||finishedAt);const durationMinutes=Math.max(1,Math.round((finishedAt-started)/60000));
 const isCustom=!!workoutDraft?.custom; const savedWorkout={date:finishedAt.toISOString(),startedAt:started.toISOString(),finishedAt:finishedAt.toISOString(),position:state.position,title:w.title,phase:isCustom?'Additional session':w.phase,block:isCustom?'—':w.block,custom:isCustom,quickType:workoutDraft?.quickType||'',notes,mainLogs,accLogs,extraLogs,prs:accepted,volume,durationMinutes,completedSets,exerciseCount};
 state.history.push(savedWorkout);extraExercises=[];clearWorkoutDraft();if(!isCustom)state.position=Math.min(state.position+1,PROGRAMME.length-1);save();releaseWakeLock();nav('home');showWorkoutSummary(savedWorkout)
}
function showWorkoutSummary(h){document.getElementById('workoutSummary')?.remove();const modal=document.createElement('div');modal.id='workoutSummary';modal.className='summary-overlay';modal.innerHTML=`<div class="summary-panel"><div class="row"><div><div class="muted small">SESSION COMPLETE</div><div class="title">${esc(h.title)}</div></div><span class="tag">Saved</span></div><div class="summary-grid"><div class="metric"><b>${fmt(h.volume||0)}kg</b><span>Total volume</span></div><div class="metric"><b>${h.completedSets||0}</b><span>Sets completed</span></div><div class="metric"><b>${h.exerciseCount||0}</b><span>Exercises</span></div><div class="metric"><b>${h.durationMinutes||0} min</b><span>Session time</span></div></div>${(h.prs||[]).length?`<div class="summary-pr">🏆 ${(h.prs||[]).length} new estimated PR${h.prs.length===1?'':'s'} recorded.</div>`:''}${h.notes?`<div class="listitem"><b>Coach note</b><div class="muted small">${esc(h.notes)}</div></div>`:''}<button class="btn green" onclick="closeWorkoutSummary()">DONE</button></div>`;document.body.appendChild(modal)}
function closeWorkoutSummary(){document.getElementById('workoutSummary')?.remove();nav('home')}

function sessionVolume(mainLogs=[],accLogs=[],extraLogs=[]){let v=0;mainLogs.forEach(x=>{v+=Number(x.weight||0)*Number(x.reps||0)});accLogs.forEach(x=>{v+=Number(x.weight||0)*Number(x.reps||0)});extraLogs.forEach(x=>{if(!x.bodyweight)v+=Number(x.weight||0)*Number(x.reps||0)});return Math.round(v)}
function skipForward(){if(confirm('Skip this workout and move to the next?')){clearWorkoutDraft();extraExercises=[];state.position=Math.min(state.position+1,PROGRAMME.length-1);save();releaseWakeLock();toast('Moved forward');render()}}
function renderProgramme(){document.getElementById('programme').innerHTML=`<div class="card hero"><div class="title">Programme</div><div class="muted">All 36 workouts from Phases 1–3. Tap any session to jump.</div></div>`+PHASES.map((p,pi)=>`<div class="card"><div class="h2">${p.name}</div><div class="muted small">${p.desc}</div>${p.blocks.map(b=>`<div class="section-title">Block ${b.block}</div>${b.days.map((d,di)=>{let idx=PROGRAMME.findIndex(x=>x.phaseIndex===pi&&x.block===b.block&&x.dayIndex===di);return `<div class="listitem programme-day ${idx===state.position?'current':''}" onclick="jumpTo(${idx})"><div class="row"><div><b>${d.title}</b><div class="muted small">${d.items.filter(i=>i.kind==='main'||i.kind==='benchMirror').map(mainSummary).join(' • ')}</div></div><span class="tag">#${idx+1}</span></div></div>`}).join('')}`).join('')}</div>`).join('')}
function jumpTo(idx){if(confirm(`Jump to workout #${idx+1}?`)){clearWorkoutDraft();extraExercises=[];state.position=idx;save();nav('home');toast('Workout selected')}}
function timelineEvents(){let events=[];(state.history||[]).forEach((h,i)=>{events.push({date:h.date,type:'workout',icon:'✓',title:h.title,detail:`${fmt(h.volume||0)}kg volume${h.notes?' • '+h.notes:''}`});if((h.prs||[]).length)(h.prs||[]).forEach(pr=>events.push({date:pr.date||h.date,type:'pr',icon:'🏆',title:`New ${LIFTS[pr.lift]} PR`,detail:`${fmt(pr.old||0)}kg → ${fmt(pr.newMax||pr.est)}kg`}));const n=i+1;if([10,25,50,100].includes(n))events.push({date:h.date,type:'milestone',icon:'◆',title:`${n} workouts completed`,detail:'Consistency milestone'});if(h.volume&&h.volume===Math.max(...(state.history||[]).slice(0,i+1).map(x=>Number(x.volume)||0)))events.push({date:h.date,type:'milestone',icon:'↗',title:'Highest session volume',detail:`${fmt(h.volume)}kg`})});const totals=[400,425,450,475,500];totals.forEach(t=>{if(powerTotal()>=t)events.push({date:(state.prs||[]).slice(-1)[0]?.date||new Date().toISOString(),type:'milestone',icon:'★',title:`${t}kg Club reached`,detail:'Powerlifting total milestone'})});return events.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20)}
function timelineHtml(){const ev=timelineEvents();return ev.length?`<div class="timeline">${ev.map(e=>`<div class="timeline-item ${e.type}"><span class="timeline-dot"></span><div class="timeline-date">${new Date(e.date).toLocaleDateString()}</div><div class="timeline-title">${e.icon} ${e.title}</div><div class="muted small">${e.detail}</div></div>`).join('')}</div>`:'<div class="muted">Complete a workout to begin your timeline.</div>'}
function exerciseRecords(){const map=new Map();for(const h of (state.history||[])){for(const x of [...(h.accLogs||[]),...(h.extraLogs||[])]){const name=String(x.name||'').trim(),reps=Number(x.reps||0),weight=Number(x.weight||0),bodyweight=!!x.bodyweight;if(!name||!reps)continue;const key=name.toLowerCase(),score=bodyweight?reps:epley(weight,reps),candidate={name,weight,reps,bodyweight,score,date:h.date};const old=map.get(key);if(!old||candidate.score>old.score||(candidate.score===old.score&&candidate.weight>old.weight))map.set(key,candidate)}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function recordsHtml(){const records=exerciseRecords();if(!records.length)return '<div class="muted">Log accessories or extra exercises to build your records.</div>';return `<input class="input" id="recordSearch" placeholder="Search exercise records" oninput="filterExerciseRecords(this.value)"><div id="recordList">${records.map(r=>`<div class="listitem exercise-record" data-name="${esc(r.name.toLowerCase())}"><div class="record-row"><div><b>${esc(r.name)}</b><div class="muted small">${new Date(r.date).toLocaleDateString()}</div></div><div class="record-value">${r.bodyweight?`${r.reps} reps`:`${fmt(r.weight)}kg × ${r.reps}`}<span>${r.bodyweight?'Best bodyweight set':`Est. max ${fmt(r.score)}kg`}</span></div></div></div>`).join('')}</div>`}
function filterExerciseRecords(q){const term=String(q||'').toLowerCase();document.querySelectorAll('.exercise-record').forEach(el=>el.classList.toggle('hidden',!el.dataset.name.includes(term)))}
function renderProgress(){let hist=[...state.history].reverse();const pTotal=powerTotal();const goal=state.settings.goalTotal||500;document.getElementById('progress').innerHTML=`<div class="card hero"><div class="title">Progress</div><div class="muted">${fmt(pTotal)}kg power total • ${fmt(Math.max(0,goal-pTotal))}kg to 500kg</div></div><div class="grid"><div class="metric"><b>${state.history.length}</b><span>Completed workouts</span></div><div class="metric"><b>${PROGRAMME.length-state.position}</b><span>Remaining</span></div><div class="metric"><b>${fmt(pTotal)}kg</b><span>Squat + Bench + Deadlift</span></div></div><div class="card"><div class="h2">Estimated 1RM Trend</div><div class="muted small">Main lifts only. Assistance does not update your 1RM.</div>${liftGraph()}</div><div class="card"><div class="h2">Session Volume</div><div class="muted small">Measured in total kg lifted: weight × reps for every logged set.</div>${volumeSummary()}${volumeGraph()}</div><div class="card"><div class="h2">Exercise Records</div><div class="muted small">Your best logged set for every assistance and extra exercise.</div>${recordsHtml()}</div><div class="card"><div class="h2">Progress Timeline</div><div class="muted small">Your training story: workouts, PRs and milestones.</div>${timelineHtml()}</div><div class="card"><div class="h2">Workout Log</div>${hist.length?hist.map((h,i)=>historyRow(h,state.history.length-1-i)).join(''):'<div class="muted">No history yet.</div>'}</div>`}
function liftGraph(){const prs=state.prs||[];const lifts=['deadlift','squat','bench','ohp'];let lines=lifts.map(l=>`<div class="metric"><b>${fmt(state.oneRMs[l]||0)}</b><span>${LIFTS[l]}</span></div>`).join('');let points=prs.slice(-12).map((p,i)=>({x:20+i*(260/Math.max(1,prs.slice(-12).length-1)),y:120-((p.newMax||p.est||0)-80)*1.2,lift:p.lift,val:p.newMax||p.est}));let poly=points.map(p=>`${p.x},${Math.max(20,Math.min(125,p.y))}`).join(' ');return `<div class="grid">${lines}</div><svg class="graph" viewBox="0 0 300 150"><text x="12" y="22" class="graph-label">PR updates</text>${poly?`<polyline class="graph-line" points="${poly}"/>${points.map(p=>`<circle class="graph-dot" cx="${p.x}" cy="${Math.max(20,Math.min(125,p.y))}" r="4"><title>${LIFTS[p.lift]} ${fmt(p.val)}kg</title></circle>`).join('')}`:`<text x="80" y="82" class="graph-label">No PR updates yet</text>`}</svg>`}
function volumeSummary(){let h=(state.history||[]);let last=h[h.length-1];let last10=h.slice(-10);let total=last10.reduce((a,x)=>a+(Number(x.volume)||0),0);let avg=last10.length?Math.round(total/last10.length):0;let best=last10.reduce((m,x)=>Math.max(m,Number(x.volume)||0),0);return `<div class="grid"><div class="metric"><b>${fmt(last?.volume||0)}kg</b><span>Last workout volume</span></div><div class="metric"><b>${fmt(avg)}kg</b><span>Average last ${last10.length||0}</span></div><div class="metric"><b>${fmt(best)}kg</b><span>Highest last ${last10.length||0}</span></div></div><div class="muted small">Graph bars are total workout volume in kilograms. Taller bar = more kg lifted in that session.</div>`}
function volumeGraph(){let h=(state.history||[]).slice(-10);let max=Math.max(1,...h.map(x=>x.volume||0));let ticks=[max,Math.round(max*.5),0];return `<svg class="graph" viewBox="0 0 320 170"><text x="12" y="18" class="graph-label">Last ${h.length||0} workouts • kg lifted</text><line class="gridline" x1="42" y1="35" x2="305" y2="35"/><line class="gridline" x1="42" y1="85" x2="305" y2="85"/><line class="gridline" x1="42" y1="135" x2="305" y2="135"/><text x="4" y="39" class="graph-label">${fmt(ticks[0])}</text><text x="4" y="89" class="graph-label">${fmt(ticks[1])}</text><text x="20" y="139" class="graph-label">0</text>${h.length?h.map((x,i)=>{let bw=18,gap=8,base=135,height=Math.max(2,((x.volume||0)/max)*100),xx=48+i*(bw+gap);return `<rect class="bar" x="${xx}" y="${base-height}" width="${bw}" height="${height}"><title>${x.title}: ${x.volume||0}kg</title></rect><text x="${xx-2}" y="154" class="graph-label">${i+1}</text>`}).join(''):`<text x="95" y="90" class="graph-label">No workouts completed yet</text>`}</svg>`}
function historyRow(h,realIndex){const extras=(h.extraLogs||[]);const extraNames=[...new Set(extras.map(x=>x.name))];return `<div class="listitem"><b>${esc(h.title)}</b><div class="muted small">${esc(h.phase||'')} • ${new Date(h.date).toLocaleString()}</div><div class="history-meta"><span>⏱ ${Number(h.durationMinutes||0)} min</span><span>🏋️ ${fmt(h.volume||0)}kg</span><span>✓ ${Number(h.completedSets||0)} sets</span></div>${extraNames.length?`<div class="small"><b>Extras:</b> ${extraNames.map(esc).join(', ')}</div>`:''}${h.notes?`<div class="small"><b>Coach note:</b> ${esc(h.notes)}</div>`:''}<div class="two-buttons"><button class="btn edit mini" onclick="editHistory(${realIndex})">Edit workout</button><button class="btn secondary mini" onclick="deleteHistory(${realIndex},false)">Delete only</button></div><button class="btn danger mini" onclick="deleteHistory(${realIndex},true)">Delete & go back</button></div>`}
function localDateTimeValue(d){const x=new Date(d);if(Number.isNaN(x.getTime()))return '';const pad=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`}
function historyTimes(h){const finish=new Date(h.finishedAt||h.date||Date.now());const start=h.startedAt?new Date(h.startedAt):new Date(finish.getTime()-Math.max(1,Number(h.durationMinutes||1))*60000);return {start,finish}}
function editLogRows(logs,type){return (logs||[]).map((x,i)=>{const label=type==='main'?(x.lift?LIFTS[x.lift]||x.lift:'Main lift'):(x.name||'Exercise');const set=x.set||i+1;const bw=type==='extra'&&x.bodyweight;return `<div class="edit-log-row"><div class="edit-log-name"><b>${esc(label)}</b><div class="muted small">Set ${esc(set)}</div></div><input class="input" id="edit-${type}-w-${i}" type="number" step="0.5" inputmode="decimal" value="${bw?'':esc(x.weight||'')}" placeholder="${bw?'BW':'kg'}" ${bw?'disabled':''}><input class="input" id="edit-${type}-r-${i}" type="number" step="1" inputmode="numeric" value="${esc(x.reps||'')}" placeholder="reps"></div>`}).join('')}
function editHistory(i){const h=state.history[i];if(!h)return;const t=historyTimes(h);document.getElementById('editWorkoutModal')?.remove();const modal=document.createElement('div');modal.id='editWorkoutModal';modal.className='edit-overlay';modal.innerHTML=`<div class="edit-panel"><div class="row"><div><div class="muted small">EDIT PREVIOUS WORKOUT</div><div class="title">${esc(h.title)}</div></div><button class="btn secondary mini" onclick="closeHistoryEditor()">Close</button></div><div class="edit-section"><div class="h2">Workout time</div><div class="muted small">Change either time and the duration will be recalculated.</div><div class="edit-time-grid"><label class="small muted">Started<input class="input" id="editStart" type="datetime-local" value="${localDateTimeValue(t.start)}"></label><label class="small muted">Finished<input class="input" id="editFinish" type="datetime-local" value="${localDateTimeValue(t.finish)}"></label></div></div><div class="edit-section"><div class="h2">Coach note</div><textarea id="editNotes" class="input note">${esc(h.notes||'')}</textarea></div>${(h.mainLogs||[]).length?`<div class="edit-section"><div class="h2">Main work</div>${editLogRows(h.mainLogs,'main')}</div>`:''}${(h.accLogs||[]).length?`<div class="edit-section"><div class="h2">Accessories</div>${editLogRows(h.accLogs,'acc')}</div>`:''}${(h.extraLogs||[]).length?`<div class="edit-section"><div class="h2">Extra exercises</div>${editLogRows(h.extraLogs,'extra')}</div>`:''}<div class="edit-actions"><button class="btn green" onclick="saveHistoryEdit(${i})">SAVE CHANGES</button></div></div>`;document.body.appendChild(modal)}
function closeHistoryEditor(){document.getElementById('editWorkoutModal')?.remove()}
function readEditedLogs(logs,type){return (logs||[]).map((x,i)=>({...x,weight:type==='extra'&&x.bodyweight?'':(document.getElementById(`edit-${type}-w-${i}`)?.value||''),reps:document.getElementById(`edit-${type}-r-${i}`)?.value||''}))}
function saveHistoryEdit(i){const h=state.history[i];if(!h)return;const start=new Date(document.getElementById('editStart')?.value);const finish=new Date(document.getElementById('editFinish')?.value);if(Number.isNaN(start.getTime())||Number.isNaN(finish.getTime())){toast('Please enter valid start and finish times');return}if(finish<=start){toast('Finish time must be after start time');return}const mainLogs=readEditedLogs(h.mainLogs,'main'),accLogs=readEditedLogs(h.accLogs,'acc'),extraLogs=readEditedLogs(h.extraLogs,'extra');const volume=sessionVolume(mainLogs,accLogs,extraLogs);const durationMinutes=Math.max(1,Math.round((finish-start)/60000));const exerciseCount=new Set([...(mainLogs||[]).filter(x=>Number(x.reps)).map(x=>x.lift||x.id),...(accLogs||[]).filter(x=>Number(x.reps)).map(x=>x.name),...(extraLogs||[]).filter(x=>Number(x.reps)).map(x=>x.name)]).size;state.history[i]={...h,date:finish.toISOString(),startedAt:start.toISOString(),finishedAt:finish.toISOString(),durationMinutes,notes:document.getElementById('editNotes')?.value||'',mainLogs,accLogs,extraLogs,volume,exerciseCount};save();closeHistoryEditor();render();toast('Workout updated')}

function deleteHistory(i,goBack){const h=state.history[i];if(!h)return;if(confirm(goBack?'Delete this workout and return to that session?':'Delete this history entry only?')){state.history.splice(i,1);if(goBack)state.position=h.position;save();toast(goBack?'Deleted and returned':'Deleted');render()}}

function startOfWeek(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function recentHistory(days=7){const cut=new Date();cut.setDate(cut.getDate()-days);return (state.history||[]).filter(h=>new Date(h.date)>=cut)}
function readinessData(){const h=recentHistory(4);const volume=h.reduce((a,x)=>a+Number(x.volume||0),0);const last=(state.history||[]).slice(-1)[0];const restDays=last?Math.floor((Date.now()-new Date(last.date))/86400000):7;if(h.length>=3||volume>45000)return {label:'Fatigued',icon:'🔴',detail:'You have trained hard recently. Keep today crisp and avoid forcing extra reps.'};if(restDays>=2)return {label:'Fresh',icon:'🟢',detail:'You have had useful recovery time. Push the target if warm-ups move well.'};return {label:'Normal',icon:'🟡',detail:'Normal training readiness. Follow the plan and earn any extra reps.'}}
function liftTrend(lift){const rows=(state.history||[]).flatMap(h=>(h.mainLogs||[]).filter(x=>x.lift===lift&&Number(x.weight)&&Number(x.reps)).map(x=>({date:h.date,e:epley(x.weight,x.reps)})));if(rows.length<2)return {text:'Building data',cls:'trend-flat',delta:0};const recent=rows.slice(-3).reduce((a,x)=>a+x.e,0)/Math.min(3,rows.length);const prior=rows.slice(-6,-3);if(!prior.length)return {text:'Baseline set',cls:'trend-flat',delta:0};const old=prior.reduce((a,x)=>a+x.e,0)/prior.length;const d=Math.round((recent-old)*10)/10;return d>1?{text:`+${fmt(d)}kg`,cls:'trend-up',delta:d}:d<-1?{text:`${fmt(d)}kg`,cls:'trend-down',delta:d}:{text:'Stable',cls:'trend-flat',delta:d}}
function coachInsights(){const out=[];const week=recentHistory(7), prev=(state.history||[]).filter(h=>{const age=(Date.now()-new Date(h.date))/86400000;return age>7&&age<=14});const wv=week.reduce((a,h)=>a+Number(h.volume||0),0),pv=prev.reduce((a,h)=>a+Number(h.volume||0),0);if(week.length)out.push(`${week.length} workout${week.length===1?'':'s'} completed in the last seven days.`);if(pv&&wv)out.push(`Weekly volume is ${Math.abs(Math.round((wv-pv)/pv*100))}% ${wv>=pv?'higher':'lower'} than the previous week.`);const trends=Object.keys(LIFTS).map(l=>({l,...liftTrend(l)})).sort((a,b)=>b.delta-a.delta);if(trends[0]?.delta>1)out.push(`${LIFTS[trends[0].l]} is your strongest recent trend at ${trends[0].text}.`);const last=(state.history||[]).slice(-1)[0];if(last?.notes)out.push(`Last note: “${last.notes}”`);if(!out.length)out.push('Complete a few workouts and Coach will start spotting useful patterns.');return out.slice(0,4)}
function weeklyComparison(){const now=Date.now(),week=(state.history||[]).filter(h=>now-new Date(h.date)<7*86400000),prev=(state.history||[]).filter(h=>{const a=(now-new Date(h.date))/86400000;return a>=7&&a<14});const sum=a=>a.reduce((n,h)=>n+Number(h.volume||0),0);const mins=a=>a.reduce((n,h)=>n+Number(h.durationMinutes||0),0);const wv=sum(week),pv=sum(prev);return {week,prev,wv,pv,weekMin:mins(week),prevMin:mins(prev),change:pv?Math.round((wv-pv)/pv*100):null}}
function confidenceFor(n){return n>=8?'High':n>=4?'Medium':'Low'}
function liftRows(lift){return (state.history||[]).flatMap(h=>(h.mainLogs||[]).filter(x=>x.lift===lift&&Number(x.weight)&&Number(x.reps)).map(x=>({date:h.date,weight:Number(x.weight),reps:Number(x.reps),est:epley(Number(x.weight),Number(x.reps)),title:h.title}))).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function accessoryVolumeByGroup(hist,matcher){return hist.reduce((sum,h)=>sum+[...(h.accLogs||[]),...(h.extraLogs||[])].filter(x=>matcher(String(x.name||'').toLowerCase())).reduce((a,x)=>a+Number(x.weight||0)*Number(x.reps||0),0),0)}
function journalSignals(){const notes=(state.history||[]).filter(h=>h.notes).slice(-6);const text=notes.map(h=>String(h.notes).toLowerCase());const hard=text.filter(x=>/hard|tough|poor sleep|fatigue|brutal|joint|discomfort/.test(x)).length;const strong=text.filter(x=>/strong|moved well|excellent|good|easy/.test(x)).length;return {notes,hard,strong}}
function buildCoachObservations(){const obs=[],cmp=weeklyComparison(),hist=state.history||[],total=powerTotal(),goal=state.settings.goalTotal||500;
  const trends=Object.keys(LIFTS).map(l=>({lift:l,rows:liftRows(l),trend:liftTrend(l)})).sort((a,b)=>b.trend.delta-a.trend.delta);
  const best=trends.find(x=>x.trend.delta>1);if(best){const rows=best.rows.slice(-6);obs.push({type:'positive',icon:'🟢',title:`${LIFTS[best.lift]} is moving well`,text:`Estimated strength is ${best.trend.text} across the recent comparison window.`,confidence:confidenceFor(rows.length),why:`Recent ${LIFTS[best.lift]} working sets produced a higher estimated 1RM than the preceding sets.`,evidence:rows.slice(-4).map(x=>`${new Date(x.date).toLocaleDateString()}: ${fmt(x.weight)}kg × ${x.reps} (est. ${fmt(x.est)}kg)`)})}
  const stalled=trends.find(x=>x.rows.length>=6&&x.trend.delta<=1&&x.trend.delta>=-1);if(stalled)obs.push({type:'watch',icon:'🟡',title:`${LIFTS[stalled.lift]} is holding steady`,text:'The recent trend is flat. Add a clean rep before forcing a load increase.',confidence:confidenceFor(stalled.rows.length),why:'The average estimated 1RM for the latest three working sets is within 1kg of the preceding three.',evidence:stalled.rows.slice(-6).map(x=>`${new Date(x.date).toLocaleDateString()}: est. ${fmt(x.est)}kg`)})
  if(cmp.week.length){const ch=cmp.change;obs.push({type:ch!==null&&ch>18?'alert':'info',icon:ch!==null&&ch>18?'🟠':'🔵',title:`${cmp.week.length} workout${cmp.week.length===1?'':'s'} in seven days`,text:ch===null?`${fmt(cmp.wv)}kg logged this week. A second full week will unlock a comparison.`:`Weekly volume is ${Math.abs(ch)}% ${ch>=0?'higher':'lower'} than last week.`,confidence:confidenceFor(cmp.week.length+cmp.prev.length),why:'This compares total logged volume from the latest seven days with the previous seven-day period.',evidence:[`This week: ${fmt(cmp.wv)}kg across ${cmp.week.length} sessions`,`Previous week: ${fmt(cmp.pv)}kg across ${cmp.prev.length} sessions`]})}
  const now=Date.now(),last14=hist.filter(h=>now-new Date(h.date)<14*86400000),prior14=hist.filter(h=>{const a=(now-new Date(h.date))/86400000;return a>=14&&a<28});const back=n=>/row|pull|chin|back|lat/.test(n);const bv=accessoryVolumeByGroup(last14,back),pbv=accessoryVolumeByGroup(prior14,back);if(pbv&&bv<pbv*.82)obs.push({type:'watch',icon:'🟡',title:'Upper-back volume has dipped',text:`Rowing and pulling volume is ${Math.round((1-bv/pbv)*100)}% lower than the previous fortnight.`,confidence:confidenceFor(last14.length+prior14.length),why:'Exercises containing row, pull, chin, back or lat are grouped as upper-back work.',evidence:[`Latest 14 days: ${fmt(bv)}kg`,`Previous 14 days: ${fmt(pbv)}kg`]})
  const js=journalSignals();if(js.hard>=3)obs.push({type:'alert',icon:'🟠',title:'Your notes suggest accumulated fatigue',text:`${js.hard} of your last ${js.notes.length} written notes mention a hard session, poor sleep or discomfort.`,confidence:confidenceFor(js.notes.length),why:'Coach scans only the notes you chose to save and looks for repeated recovery warnings.',evidence:js.notes.slice(-4).map(h=>`${new Date(h.date).toLocaleDateString()}: ${h.notes}`)})
  else if(js.strong>=3)obs.push({type:'positive',icon:'🟢',title:'Training quality looks positive',text:`${js.strong} of your last ${js.notes.length} notes describe strong or good sessions.`,confidence:confidenceFor(js.notes.length),why:'Repeated positive wording in your recent Coach Journal suggests training is moving well.',evidence:js.notes.slice(-4).map(h=>`${new Date(h.date).toLocaleDateString()}: ${h.notes}`)})
  obs.push({type:'goal',icon:'🎯',title:`${fmt(Math.max(0,goal-total))}kg to the ${goal}kg Club`,text:`Current power total: ${fmt(total)}kg. The club uses squat, bench and deadlift only.`,confidence:'High',why:'This uses your current saved 1RMs for squat, bench and deadlift.',evidence:[`Deadlift ${fmt(state.oneRMs.deadlift)}kg`,`Squat ${fmt(state.oneRMs.squat)}kg`,`Bench ${fmt(state.oneRMs.bench)}kg`]});
  if(!hist.length)return [{type:'info',icon:'🔵',title:'Coach is learning your training',text:'Complete a few workouts to unlock evidence-based trends and comparisons.',confidence:'Low',why:'There is not enough workout history yet.',evidence:['No completed workouts are stored.']}];return obs.slice(0,5)}
function observationHtml(o,i){return `<div class="observation-card ${o.type}"><button class="why-btn" onclick="showObservationWhy(${i})" aria-label="Why am I seeing this?">i</button><div class="observation-title">${o.icon} ${esc(o.title)}</div><div class="observation-text">${esc(o.text)}</div><div class="observation-meta"><span class="confidence">${esc(o.confidence)} confidence</span></div></div>`}
function showObservationWhy(i){const o=buildCoachObservations()[i];if(!o)return;document.getElementById('whyObservation')?.remove();const modal=document.createElement('div');modal.id='whyObservation';modal.className='why-overlay';modal.innerHTML=`<div class="why-panel"><div class="row"><div><div class="muted small">WHY AM I SEEING THIS?</div><div class="h2">${o.icon} ${esc(o.title)}</div></div><button class="btn secondary mini" onclick="closeObservationWhy()">Close</button></div><div class="observation-text" style="font-size:14px;margin-top:10px">${esc(o.why)}</div><div class="evidence-list">${(o.evidence||[]).map(x=>`<div class="evidence-item">${esc(x)}</div>`).join('')}</div><span class="confidence">${esc(o.confidence)} confidence</span></div>`;document.body.appendChild(modal)}

function weeklyReviewHtml(){const c=weeklyComparison(),prs=c.week.reduce((n,h)=>n+(h.prs||[]).length,0),avg=c.week.length?Math.round(c.weekMin/c.week.length):0;let focus='Complete the programmed work and keep logging consistently.';if(c.change!==null&&c.change>20)focus='Protect recovery: volume has risen sharply.';else if(c.change!==null&&c.change<-15)focus='Rebuild consistency and complete the planned sessions.';const trends=Object.keys(LIFTS).map(l=>({l,...liftTrend(l)})).sort((a,b)=>b.delta-a.delta);if(trends[0]?.delta>1)focus=`Keep the ${LIFTS[trends[0].l]} momentum while maintaining the other lifts.`;return `<div class="review-line"><span>Workouts</span><b>${c.week.length}</b></div><div class="review-line"><span>Total volume</span><b>${fmt(c.wv)}kg ${c.change===null?'':`(${c.change>=0?'+':''}${c.change}%)`}</b></div><div class="review-line"><span>Training time</span><b>${c.weekMin} min</b></div><div class="review-line"><span>Average session</span><b>${avg} min</b></div><div class="review-line"><span>New PRs</span><b>${prs}</b></div><div class="review-line"><span>Next focus</span><b>${esc(focus)}</b></div>`}
function monthlyHighlightsHtml(){const cut=new Date();cut.setDate(cut.getDate()-30);const h=(state.history||[]).filter(x=>new Date(x.date)>=cut),total=h.reduce((a,x)=>a+Number(x.volume||0),0),mins=h.reduce((a,x)=>a+Number(x.durationMinutes||0),0),prs=h.reduce((a,x)=>a+(x.prs||[]).length,0),best=h.reduce((m,x)=>Number(x.volume||0)>Number(m?.volume||0)?x:m,null);const names={};h.forEach(x=>[...(x.accLogs||[]),...(x.extraLogs||[])].forEach(y=>{if(y.name)names[y.name]=(names[y.name]||0)+1}));const fav=Object.entries(names).sort((a,b)=>b[1]-a[1])[0];return `<div class="month-grid"><div class="month-highlight"><b>${h.length}</b><span>Workouts</span></div><div class="month-highlight"><b>${fmt(total)}kg</b><span>Total volume</span></div><div class="month-highlight"><b>${Math.round(mins/60*10)/10}h</b><span>Time trained</span></div><div class="month-highlight"><b>${prs}</b><span>New PRs</span></div><div class="month-highlight"><b>${best?esc(best.title):'—'}</b><span>Highest-volume session</span></div><div class="month-highlight"><b>${fav?esc(fav[0]):'—'}</b><span>Most logged accessory</span></div></div>`}
function renderCoach(){const el=document.getElementById('coach');if(!el)return;const r=readinessData(),w=current(),week=recentHistory(7),weekVol=week.reduce((a,h)=>a+Number(h.volume||0),0),weekMin=week.reduce((a,h)=>a+Number(h.durationMinutes||0),0),goal=state.settings.goalTotal||500,totalKg=powerTotal(),pct=Math.min(100,Math.round(totalKg/goal*100)),obs=buildCoachObservations();const journals=(state.history||[]).filter(h=>h.notes).slice(-5).reverse();el.innerHTML=`<div class="card hero"><div class="coach-kicker">COACH HUB</div><div class="title">Your training briefing</div><div class="muted">Evidence-based targets, recovery and patterns from your own history.</div></div><div class="card coach-card"><div class="coach-kicker">TODAY'S MISSION</div><div class="coach-focus">${esc(w.title)}</div><div class="coach-detail">${esc(missionText())}</div></div><div class="card"><div class="h2">Readiness</div><div class="readiness"><div class="readiness-dot">${r.icon}</div><div><b>${r.label}</b><div class="muted small">${r.detail}</div></div></div></div><div class="card"><div class="h2">Coach's observations</div><div class="muted small">The most useful patterns are ranked first. Tap “i” to see the evidence.</div><div class="observation-feed">${obs.map(observationHtml).join('')}</div></div><div class="card weekly-review"><div class="h2">Weekly review</div>${weeklyReviewHtml()}</div><div class="card"><div class="h2">Strength trends</div>${Object.keys(LIFTS).map(l=>{const t=liftTrend(l),rows=liftRows(l),last=rows.slice(-1)[0],first=rows.slice(-6)[0];return `<div class="listitem trend-card" onclick="toggleTrendDetail(this)"><div class="row"><b>${LIFTS[l]}</b><span class="${t.cls}">${t.text} ▾</span></div><div class="trend-detail">${rows.length<2?'More logged working sets are needed.':`Latest estimated max: ${fmt(last.est)}kg. ${first?`Comparison point: ${fmt(first.est)}kg on ${new Date(first.date).toLocaleDateString()}.`:''}`}</div></div>`}).join('')}</div><div class="card"><div class="h2">Goals</div><div class="goal-row"><div class="goal-label"><b>${goal}kg Club</b><span>${fmt(totalKg)} / ${fmt(goal)}kg</span></div><div class="progressbar"><i style="width:${pct}%"></i></div></div>${[['deadlift',180],['squat',140],['bench',110]].map(([l,g])=>{const v=state.oneRMs[l]||0,p=Math.min(100,Math.round(v/g*100));return `<div class="goal-row"><div class="goal-label"><span>${LIFTS[l]}</span><span>${fmt(v)} / ${g}kg</span></div><div class="progressbar"><i style="width:${p}%"></i></div></div>`}).join('')}</div><div class="card"><div class="h2">Monthly highlights</div>${monthlyHighlightsHtml()}</div><div class="card"><div class="h2">Coach journal</div><div class="muted small">Your notes help Coach identify repeated recovery and performance patterns.</div>${journals.length?journals.map(h=>`<div class="listitem journal-entry"><b>${esc(h.title)}</b><div class="muted small">${new Date(h.date).toLocaleDateString()}</div><div style="margin-top:6px">${esc(h.notes)}</div></div>`).join(''):'<div class="muted" style="margin-top:10px">Your workout notes will appear here.</div>'}</div>`}

function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card hero"><div class="title">Settings</div><div class="muted">Manage your training, preferences and backups.</div></div><div class="card"><div class="h2">1RMs</div>${['deadlift','squat','bench','ohp'].map(l=>`<label class="small muted">${LIFTS[l]}</label><input class="input" type="number" id="rm-${l}" value="${state.oneRMs[l]}">`).join('')}<button class="btn" onclick="saveMaxes()">Save maxes</button></div><div class="card"><div class="h2">Cycle position</div><div class="muted">Current: workout #${state.position+1} of ${PROGRAMME.length}</div><input class="input" type="number" min="1" max="${PROGRAMME.length}" id="pos" value="${state.position+1}"><button class="btn secondary" onclick="setPos()">Set position</button></div><div class="card"><div class="h2">Workout behaviour</div><div class="settings-row"><div><b>Auto rest timer</b><div class="muted small">Starts after each completed set.</div></div><button class="btn secondary toggle" onclick="toggleAutoRest()">${state.settings.autoRest?'On':'Off'}</button></div><div class="settings-row"><div><b>Coach Mode</b><div class="muted small">Creates targets from your previous performance.</div></div><button class="btn secondary toggle" onclick="toggleCoachMode()">${state.settings.coachMode===false?'Off':'On'}</button></div><div class="settings-row"><div><b>Gym Mode</b><div class="muted small">Keeps the screen awake during workouts where supported.</div></div><span class="tag">On during workout</span></div><div class="settings-row"><div><b>Plate calculator</b><div class="muted small">Shown under main work weights using a 20kg bar.</div></div><span class="tag">20kg bar</span></div></div><div class="card"><div class="h2">Backup & Restore</div><div class="muted small">Keep a safe copy of your workout history and restore it on this or another installation.</div><button class="btn secondary" onclick="exportData()">Export Backup</button><button class="btn secondary" onclick="chooseImportFile()">Import Backup</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="handleImportFile(event)"></div><div class="card danger-zone"><div class="h2">Data controls</div><button class="btn danger" onclick="clearHistory()">Clear history only</button><button class="btn danger" onclick="resetAll()">Reset everything</button></div><div class="footer-note">Build: ${VERSION}</div>`}

async function exportData(){
  const payload={backupFormat:BACKUP_FORMAT,backupVersion:BACKUP_VERSION,exportedAt:new Date().toISOString(),appVersion:VERSION,state};
  const json=JSON.stringify(payload,null,2);
  const filename='StrengthOS-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([json],filename,{type:'application/json'});
  try{
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:'StrengthOS backup',text:'StrengthOS workout-data backup',files:[file]});
      toast('Backup shared');
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError')return;
    console.warn('File share failed',e);
  }
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(json);
      showBackupFallback(json,filename,true);
      return;
    }
  }catch(e){console.warn('Clipboard backup failed',e)}
  try{
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Backup downloaded');
  }catch(e){showBackupFallback(json,filename,false)}
}
function chooseImportFile(){const input=document.getElementById('importFile');if(input){input.value='';input.click()}}
function normaliseImportedState(parsed){const candidate=parsed&&parsed.backupFormat===BACKUP_FORMAT?parsed.state:parsed;if(!candidate||typeof candidate!=='object')throw new Error('This file does not contain StrengthOS data.');if(!candidate.oneRMs||typeof candidate.oneRMs!=='object')throw new Error('The backup is missing lift maxes.');if(!Array.isArray(candidate.history))throw new Error('The backup is missing workout history.');const position=Number(candidate.position);if(!Number.isFinite(position)||position<0||position>=PROGRAMME.length)throw new Error('The programme position is invalid.');return {...DEFAULT,...candidate,position,oneRMs:{...DEFAULT.oneRMs,...candidate.oneRMs},settings:{...DEFAULT.settings,...(candidate.settings||{})},history:candidate.history,prs:Array.isArray(candidate.prs)?candidate.prs:[]}}
function handleImportFile(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result||''));const imported=normaliseImportedState(parsed);showImportConfirmation(imported,file.name)}catch(e){alert('Import failed: '+e.message)}};reader.onerror=()=>alert('Import failed: the file could not be read.');reader.readAsText(file)}
function showImportConfirmation(imported,filename){document.getElementById('importConfirm')?.remove();const last=imported.history[imported.history.length-1];const modal=document.createElement('div');modal.id='importConfirm';modal.className='backup-overlay';modal.innerHTML=`<div class="backup-panel"><div class="h2">Restore this backup?</div><div class="muted small">${filename}</div><div class="import-summary"><div class="metric"><b>${imported.history.length}</b><span>Workouts</span></div><div class="metric"><b>${imported.position+1}/${PROGRAMME.length}</b><span>Programme position</span></div><div class="metric"><b>${fmt(imported.oneRMs.deadlift)} / ${fmt(imported.oneRMs.squat)}</b><span>Deadlift / Squat</span></div><div class="metric"><b>${fmt(imported.oneRMs.bench)} / ${fmt(imported.oneRMs.ohp)}</b><span>Bench / Viking</span></div></div><div class="muted small">Last workout: ${last?new Date(last.date).toLocaleString():'None recorded'}</div><div class="warn">Importing will replace the data currently stored in this installation. Export your current data first if you need to keep it.</div><div class="two-buttons"><button class="btn secondary" onclick="closeImportConfirmation()">Cancel</button><button class="btn" id="confirmImportBtn">Import Backup</button></div></div>`;document.body.appendChild(modal);document.getElementById('confirmImportBtn').onclick=()=>applyImportedState(imported)}
function applyImportedState(imported){state=imported;save();closeImportConfirmation();render();nav('home');toast(`Backup restored • ${state.history.length} workouts`)}

function showBackupFallback(json,filename,copied){

  modal.id='backupFallback';
  modal.className='backup-overlay';
  modal.innerHTML=`<div class="backup-panel"><div class="row"><div><div class="h2">Backup ready</div><div class="muted small">${copied?'Copied to clipboard. Paste it into Notes or a text file and keep it safe.':'Select all and copy this backup into Notes or a text file.'}</div></div><button class="btn secondary mini" onclick="closeBackupFallback()">Close</button></div><textarea id="backupText" class="backup-text" readonly></textarea><div class="two-buttons"><button class="btn secondary" onclick="copyBackupText()">Copy backup</button><button class="btn" onclick="selectBackupText()">Select all</button></div><div class="muted small">Suggested filename: ${filename}</div></div>`;
  document.body.appendChild(modal);
  document.getElementById('backupText').value=json;
}

// v2.3 Effortless Logging
let activeRepInput=null;
function openRepPicker(input){if(!input||input.disabled)return;activeRepInput=input;document.getElementById('repPicker')?.remove();const current=Number(input.value||0);const overlay=document.createElement('div');overlay.id='repPicker';overlay.className='rep-picker-overlay';overlay.innerHTML=`<div class="rep-picker-panel"><div class="row"><div><div class="muted small">QUICK REP ENTRY</div><div class="h2">Choose reps</div></div><button class="btn secondary mini" onclick="closeRepPicker()">Done</button></div><div class="rep-picker-grid">${Array.from({length:20},(_,i)=>i+1).map(n=>`<button class="rep-choice ${n===current?'active':''}" onclick="chooseReps(${n})">${n}</button>`).join('')}</div><div class="two-buttons"><button class="btn secondary" onclick="chooseReps(Math.max(0,Number(activeRepInput?.value||0)-1))">− 1 rep</button><button class="btn secondary" onclick="chooseReps(Number(activeRepInput?.value||0)+1)">+ 1 rep</button></div><button class="btn ghost" onclick="customRepEntry()">Enter another number</button></div>`;document.body.appendChild(overlay)}
function chooseReps(n){if(!activeRepInput)return;activeRepInput.value=String(Math.max(0,Math.round(Number(n)||0)));activeRepInput.dispatchEvent(new Event('input',{bubbles:true}));closeRepPicker()}
function customRepEntry(){if(!activeRepInput)return;const v=prompt('Enter reps',activeRepInput.value||'');if(v!==null&&v.trim()!==''&&!isNaN(Number(v)))chooseReps(Number(v))}
function closeRepPicker(){document.getElementById('repPicker')?.remove();activeRepInput=null}
document.addEventListener('click',e=>{const input=e.target.closest('#workout .rep-tap');if(input){e.preventDefault();openRepPicker(input)}});
function nudgeWeight(id,delta){const el=document.getElementById(id);if(!el||el.disabled)return;const base=Number(el.value||0);el.value=fmt(Math.max(0,r25(base+Number(delta||0))));el.dispatchEvent(new Event('input',{bubbles:true}))}
function copyWeightDown(id){const el=document.getElementById(id);if(!el)return;const prefix=id.startsWith('accw-')?'accw-':'extraw-';const parts=id.split('-');const index=Number(parts.pop());const stem=parts.join('-');let copied=0;for(let i=index+1;i<20;i++){const next=document.getElementById(`${stem}-${i}`);if(!next)break;if(!next.value){next.value=el.value;next.dispatchEvent(new Event('input',{bubbles:true}));copied++}}toast(copied?`Weight copied to ${copied} set${copied===1?'':'s'}`:'Following sets already have a weight')}

// v2.2 Gym Experience
function previousWeightFor(name,setIndex){const prev=lastLogsForExercise(name);if(!prev||!prev.logs.length)return '';const exact=prev.logs[setIndex]||prev.logs[prev.logs.length-1];return exact&&Number(exact.weight)>0?fmt(Number(exact.weight)):''}
function estimatedSessionMinutes(){const w=current();let main=0,acc=0;w.items.forEach(it=>{if(it.kind==='main'||it.kind==='benchMirror')main+=(it.sets||1)*(restSecondsFor(it.type,'main')+50);if(it.kind==='accessory')acc+=(it.amrap?1:(it.sets||3))*(restSecondsFor('', 'accessory')+45)});return Math.max(35,Math.round((main+acc)/60))}
function sessionPreviewItems(){const w=current();return w.items.map(it=>{if(it.kind==='main'||it.kind==='benchMirror')return {icon:'🏋️',name:it.label,target:mainSummary(it),meta:it.type};const c=state.settings.coachMode===false?null:coachAccessoryTarget(it);return {icon:'💪',name:it.name,target:it.amrap?'AMRAP':`${it.sets||3} sets • ${it.reps}`,meta:c?c.headline:(it.role||'Accessory')}})}
function showSessionPreview(){document.getElementById('sessionPreview')?.remove();const w=current(),t=coachMainTarget(),items=sessionPreviewItems();const modal=document.createElement('div');modal.id='sessionPreview';modal.className='preview-overlay';modal.innerHTML=`<div class="preview-panel"><div class="row"><div><div class="muted small">SESSION PREVIEW</div><div class="title">${esc(w.title)}</div><div class="muted small">${esc(w.phase)} • Block ${w.block} • Workout ${state.position+1}/${PROGRAMME.length}</div></div><span class="tag">≈ ${estimatedSessionMinutes()} min</span></div><div class="mission"><b>Coach focus</b><span>${esc(t.headline)} — ${esc(t.detail)}</span></div><div class="preview-list">${items.map(x=>`<div class="preview-item"><div class="preview-icon">${x.icon}</div><div><div class="preview-target">${esc(x.name)}</div><div class="preview-meta">${esc(x.target)} • ${esc(x.meta)}</div></div></div>`).join('')}</div><div class="preview-actions"><button class="btn secondary" onclick="closeSessionPreview()">Not yet</button><button class="btn" onclick="beginWorkoutFromPreview()">START SESSION</button></div></div>`;document.body.appendChild(modal)}
function closeSessionPreview(){document.getElementById('sessionPreview')?.remove()}
function beginWorkoutFromPreview(){closeSessionPreview();workoutDraft={version:2,position:state.position,title:current().title,startedAt:new Date().toISOString(),savedAt:new Date().toISOString(),fields:{},completed:[],note:'',extraExercises:[],restEndAt:0};localStorage.setItem(DRAFT_KEY,JSON.stringify(workoutDraft));enableWakeLock();nav('workout');saveWorkoutDraftNow()}
function celebrate(message='Session complete!',big=false){document.querySelector('.celebration')?.remove();document.querySelector('.celebration-burst')?.remove();const layer=document.createElement('div');layer.className='celebration';const palette=['#f04444','#35d07f','#f0c243','#5aa6ff','#ffffff'];const count=big?70:36;for(let i=0;i<count;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=(Math.random()*100)+'%';bit.style.background=palette[i%palette.length];bit.style.animationDelay=(Math.random()*.45)+'s';bit.style.animationDuration=(1.3+Math.random()*1.1)+'s';bit.style.setProperty('--drift',((Math.random()-.5)*180)+'px');layer.appendChild(bit)}document.body.appendChild(layer);const burst=document.createElement('div');burst.className='celebration-burst';burst.textContent=message;document.body.appendChild(burst);try{navigator.vibrate&&navigator.vibrate(big?[80,50,120]:60)}catch(e){}setTimeout(()=>{layer.remove();burst.remove()},2600)}
function enableSwipeSets(){let startX=0,startY=0,target=null;document.addEventListener('touchstart',e=>{const row=e.target.closest('#workout .set');if(!row||e.target.matches('input,button,textarea,select'))return;target=row;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});document.addEventListener('touchmove',e=>{if(!target)return;const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))target.classList.add('swiping')},{passive:true});document.addEventListener('touchend',e=>{if(!target)return;const touch=e.changedTouches[0],dx=touch.clientX-startX,dy=touch.clientY-startY;const row=target;target=null;row.classList.remove('swiping');if(dx<-70&&Math.abs(dx)>Math.abs(dy)){const id=row.id.replace(/^set-/,'');const check=row.querySelector('.check');if(check&&!row.classList.contains('done'))check.click()}},{passive:true})}
enableSwipeSets();
const originalShowWorkoutSummary=showWorkoutSummary;showWorkoutSummary=function(h){originalShowWorkoutSummary(h);setTimeout(()=>celebrate((h.prs||[]).length?'🏆 New personal best!':'Workout complete!',(h.prs||[]).length>0),120)};
const originalToggleSet=window.toggleSet;window.toggleSet=function(id,rest=120){const el=document.getElementById('set-'+id),wasDone=el?.classList.contains('done');originalToggleSet(id,rest);if(el&&!wasDone&&el.classList.contains('done')){const workoutSets=[...document.querySelectorAll('#workout .set')];if(workoutSets.length&&workoutSets.every(x=>x.classList.contains('done')))celebrate('All sets complete!',false)}};
function animateProgressRings(){document.querySelectorAll('.club-ring').forEach(r=>{const target=Number(getComputedStyle(r).getPropertyValue('--pct'))||Number(r.style.getPropertyValue('--pct'))||0;r.style.setProperty('--pct',0);requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.setProperty('--pct',target)))})}
const originalRender=render;render=function(){originalRender();setTimeout(animateProgressRings,30)};

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{render();}catch(e){document.getElementById('home').classList.add('active');document.getElementById('home').innerHTML='<div class="card hero"><div class="title">StrengthOS</div><div class="warn">App error: '+e.message+'</div></div>';console.error(e)}
</script>
</body>
