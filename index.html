<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b0b0d"/><link rel="manifest" href="manifest.json"><title>Forge PRS</title><style>
:root{--bg:#070708;--panel:#141418;--panel2:#1f2026;--text:#f5f5f7;--muted:#a5a5ad;--red:#ff3b30;--green:#30d158;--line:#2c2c33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:16px;padding:14px 16px;background:var(--red);color:white;font-weight:700}button.secondary{background:var(--panel2);color:var(--text)}button.ghost{background:transparent;border:1px solid var(--line)}.wrap{max-width:760px;margin:0 auto;padding:20px 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;margin:10px 0 22px}.brand{font-size:31px;font-weight:800}.pill{padding:8px 12px;border-radius:999px;background:#241210;color:#ff7b72}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--panel2);border-radius:18px;padding:14px}.stat b{font-size:28px;display:block}.muted{color:var(--muted)}.big{font-size:34px;font-weight:900}.session-title{font-size:26px;font-weight:850;margin:4px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.row:first-child{border-top:0}.set{display:grid;grid-template-columns:1fr 80px 70px 54px;gap:8px;align-items:center;margin:8px 0}.set input{width:100%;background:#0e0e11;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.check{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:12px}.done{background:var(--green)!important;color:#051b0b!important}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,14,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center}.navinner{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px 18px}.nav button{background:transparent;color:var(--muted);font-size:12px;padding:10px 4px}.nav button.active{color:var(--red)}label{display:block;margin:12px 0 6px;color:var(--muted)}input,select{background:#0e0e11;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;width:100%}.small{font-size:13px}.tag{font-size:12px;background:#202026;padding:5px 8px;border-radius:999px;color:#bbb}.bar{height:12px;background:#232329;border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--red)}.phasegrid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}.box{height:24px;border-radius:7px;background:#25252c}.box.on{background:var(--red)}.danger{color:#ff7b72}.ok{color:#30d158}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div><div class="nav"><div class="navinner"><button id="tabHome" onclick="view='home';render()">Today</button><button id="tabLog" onclick="view='log';render()">Log</button><button id="tabProgress" onclick="view='progress';render()">Progress</button><button id="tabSettings" onclick="view='settings';render()">Setup</button></div></div><script src="app.js"></script></body></html>
